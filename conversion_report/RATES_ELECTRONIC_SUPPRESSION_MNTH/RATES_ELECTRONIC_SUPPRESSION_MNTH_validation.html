, prod.product_type, prod.product_sub_type, prod.PRODUCT_EXTENDED_TYPE, prod.DESCRIPTION, prod.CURRENCY, prod.RATE_INDEX,  legEnt.short_name, legEntBook.Short_Name as Processing_Org\nfrom CALYPSODBA.TRADE trade\ninner join CALYPSODBA.book book on book.book_id = trade.book_id\ninner join CALYPSODBA.PRODUCT_DESC prod on prod.product_id = trade.product_id\ninner join CALYPSODBA.LEGAL_ENTITY legEnt on legEnt.LEGAL_ENTITY_ID = trade.cpty_id\ninner join CALYPSODBA.LEGAL_ENTITY legEntBook on legEntBook.LEGAL_ENTITY_ID = book.LEGAL_ENTITY_ID\nwhere book.book_name not in ('ECN_MATCHING', 'ECN_CHARLOTTE',  'ECN_MATCHING_LDN', 'ECN_MATCHING_WEST') and trade.trade_status not in ('FO_ERR_REMOVED') and trade.trade_ID in (\nSELECT distinct TRADE_ID \nFROM CALYPSODBA.BO_MESSAGE\nWHERE MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND  PRODUCT_FAMILY <> 'CreditDefaultSwap' AND  CREATION_DATE>=  trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and CREATION_DATE < trunc(TRUNC(SYSDATE , 'Month'), 'Month'))) ecn_msg\nleft join \n(\nSelect trade_id,  amendment_date, case when amend_Mnth_Yr=Rpt_Amend_Mnt_Yr then 'VALID' else 'INVALID' end as Amend_Time_Flag,  case when (amend_new_day > = iso_week_start_dte and  amend_new_day < iso_week_end_dte) then 'VALID_W' else 'INVALID_W' end as Amend_Wkly_flag\nfrom\n(\nSelect trade_id, keyword_value as amendment_date, \ncase when instr(keyword_value, '/') = 0 then\n(substr(keyword_value, 1, 2) || '-' || substr(keyword_value, 7, 4) )\n when instr(keyword_value, '/') > 0 then \n(case length(substr(keyword_value, 1, instr(keyword_value, '/')-1)) when 1 then '0' || substr(keyword_value, 1, instr(keyword_value, '/')-1) when 2 then substr(keyword_value, 1, instr(keyword_value, '/')-1) end ) || '-'|| (Case substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) when '20' then '20' ||  substr(keyword_value, instr(keyword_value, '/', 1, 2)+3, 2)  else '20' || substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) end) end as amend_Mnth_Yr, TO_CHAR(TRUNC(LAST_DAY(ADD_MONTHS(SYSDATE,-1))+1),'MM-YYYY')  as Rpt_Amend_Mnt_Yr,\ncase when instr(keyword_value, '/') = 0 then\n(substr(keyword_value, 7, 4) || '-'|| substr(keyword_value, 1, 2) || '-' || substr(keyword_value, 4, 2))\n when instr(keyword_value, '/') > 0 then \n (Case substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) when '20' then '20' ||  substr(keyword_value, instr(keyword_value, '/', 1, 2)+3, 2)  else '20' || substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) end) || '-'||  (case length(substr(keyword_value, 1, instr(keyword_value, '/')-1)) when 1 then '0' || substr(keyword_value, 1, instr(keyword_value, '/')-1) when 2 then substr(keyword_value, 1, instr(keyword_value, '/')-1) end ) ||'-'||\n(case length(substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1))) when 1 then '0' || substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) when 2 then substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) end ) end as amend_Day,\nto_date(to_char(case when instr(keyword_value, '/') = 0 then\n(substr(keyword_value, 7, 4) || '-'|| substr(keyword_value, 1, 2) || '-' || substr(keyword_value, 4, 2))\n when instr(keyword_value, '/') > 0 then \n (Case substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) when '20' then '20' ||  substr(keyword_value, instr(keyword_value, '/', 1, 2)+3, 2)  else '20' || substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) end) || '-'||  (case length(substr(keyword_value, 1, instr(keyword_value, '/')-1)) when 1 then '0' || substr(keyword_value, 1, instr(keyword_value, '/')-1) when 2 then substr(keyword_value, 1, instr(keyword_value, '/')-1) end ) ||'-'||\n(case length(substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1))) when 1 then '0' || substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) when 2 then substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) end ) end), 'YYYY-MM-DD') as amend_new_day,  trunc(SYSDATE), TRUNC(sysdate-7, 'iw') AS iso_week_start_dte, TRUNC(sysdate-7, 'iw') + 7 AS iso_week_end_dte\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere keyword_name = 'AmendmentDate')) amend_Date_KWD\non amend_Date_KWD.trade_id = ecn_msg.trade_id\n\nleft join\n(Select trade_id, keyword_value as ECN_BROKER_BIC\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere keyword_name = 'ECN_BROKER_BIC') ECN_BROKER_BIC_KWD\non ECN_BROKER_BIC_KWD.trade_id = ecn_msg.trade_id\nleft join\n(Select trade_id, keyword_value as ECN_SOURCE\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere upper(keyword_name) like 'ECN_SOURCE') ECN_SOURCE_KWD\non ECN_SOURCE_KWD.trade_id = ecn_msg.trade_id\nleft join\n(\nSelect trade_id, EXECUTION_DATETIME, case when Execute_Yr_Mnth=Rpt_Exec_Yr_Mnth then 'VALID' else 'INVALID' end as Execute_Time_Flag, case when (Execute_Day > = iso_week_start_dte and Execute_Day< iso_week_end_dte) then 'VALID_W' else 'INVALID_W' end as Execute_wkly_flag\nfrom\n(Select trade_id, keyword_value as EXECUTION_DATETIME, substr(keyword_value, 1, 7) as Execute_Yr_Mnth, TO_CHAR(TRUNC(LAST_DAY(ADD_MONTHS(SYSDATE,-1))+1), 'YYYY-MM')  as Rpt_Exec_Yr_Mnth, to_date(to_char(substr(keyword_value, 1, 10)), 'YYYY-MM-DD') as Execute_Day, TRUNC(sysdate-7, 'iw') AS iso_week_start_dte, TRUNC(sysdate-7, 'iw') + 7 AS iso_week_end_dte\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere upper(keyword_name) like 'EXECUTION_DATETIME')) EXECUTION_DATETIME_KWD\non EXECUTION_DATETIME_KWD.trade_id = ecn_msg.trade_id\n\nleft join\n(Select trade_id, keyword_value as ExecutionVenueType\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere keyword_name =  'ExecutionVenueType') EXECUTION_VENUE_KWD\non EXECUTION_VENUE_KWD.Trade_ID = ecn_msg.trade_id\nleft join\n(\nSelect trade_id, EXERCISED_DATETIME, case when Exercised_Mtnh_Yr=Rpt_ tr(keyword_value, '/')-1)) when 1 then '0' || substr(keyword_value, 1, instr(keyword_value, '/')-1) when 2 then substr(keyword_value, 1, instr(keyword_value, '/')-1) end ) ||'-'||\n(case length(substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1))) when 1 then '0' || substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) when 2 then substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) end)) , 'YYYY-mm-dd') as exercise_new_day,  trunc(SYSDATE), TRUNC(sysdate-7, 'iw') AS iso_week_start_dte, TRUNC(sysdate-7, 'iw') + 7 AS iso_week_end_dte\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere keyword_name =  'EXERCISED_DATETIME'))EXERCISED_DATETIME_KWD\non EXERCISED_DATETIME_KWD.Trade_ID = ecn_msg.trade_id\n\nleft join\n(Select trade_id, keyword_value as Product_SubType_Keywrd\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere keyword_name =  'Product_SubType') Product_SubType_KWD\non Product_SubType_KWD.Trade_ID = ecn_msg.trade_id\nleft join\n(Select trade_id, keyword_value as SWOriginalCounterparty\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere keyword_name =  'SWOriginalCounterparty') SWOriginalCounterparty_KWD\non SWOriginalCounterparty_KWD.Trade_ID = ecn_msg.trade_id\nleft join\n(\nSelect trade_id, TerminationTradeDate, case when Term_Mtnh_Yr=Rpt_Term_Mnt_Yr then 'VALID' else 'INVALID' end as Term_Time_Flag, case when (term_new_Day > = iso_week_start_dte and  term_new_Day < iso_week_end_dte) then 'VALID_W' else 'INVALID_W' end as Term_Wkly_flag\nfrom\n(\nSelect trade_id, keyword_value as TerminationTradeDate, \n(case length(substr(keyword_value, 1, instr(keyword_value, '/')-1)) when 1 then '0' || substr(keyword_value, 1, instr(keyword_value, '/')-1) when 2 then substr(keyword_value, 1, instr(keyword_value, '/')-1) end ) || '-'|| (Case substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) when '20' then '20' ||  substr  'Month') , 'Month')-1 as Creation_End_Month,\nsysdate as create_dte\nfrom\n(Select BM_Verified_Trade.Trade_ID as uTrade_ID,  BM_Verified_Trade.event_type as uEvent_Type, BM_Verified_Trade.CREATION_DATE as uCreation_Date\nfrom\n(Select BO_Counter.Trade_id, count( BO_Counter. event_type)\nfrom (\nSELECT BO_MSG.Trade_id, min(BO_MSG.event_type) as event_type, count(BO_MSG.event_type) as counter\nFROM CALYPSODBA.BO_MESSAGE  BO_MSG\nWHERE BO_MSG.MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND BO_MSG.CREATION_DATE>= trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and BO_MSG.CREATION_DATE < trunc(TRUNC(SYSDATE , 'Month'), 'Month')\nand BO_MSG.EVENT_TYPE in ('DAY_VERIFIED_TRADE' , 'DAY_VER_STP_TRADE') AND  BO_MSG.PRODUCT_FAMILY <> 'CreditDefaultSwap'\ngroup by BO_MSG.trade_id, event_type) BO_Counter\ngroup by BO_Counter.Trade_id\nhaving count( BO_Counter. event_type) = 1) BO_Sum\ninner join\n(\n\nSelect BM.trade_id, min(BM.CREATION_DATE) as CREATION_DATE, min(BM.event_type) as event_Type\nFROM CALYPSODBA.BO_MESSAGE BM\nWHERE BM.MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND BM.CREATION_DATE>= trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and BM.CREATION_DATE < trunc(TRUNC(SYSDATE , 'Month'), 'Month')\nand BM.EVENT_TYPE in ('DAY_VERIFIED_TRADE', 'DAY_VER_STP_TRADE') AND  BM.PRODUCT_FAMILY <> 'CreditDefaultSwap'\ngroup by BM.Trade_ID\n\n) BM_Verified_Trade\non BO_Sum.Trade_ID =  BM_Verified_Trade.Trade_ID\n\nUNION \n\nSELECT BO_MSG.Trade_id as uTrade_ID, BO_MSG.event_type as uEvent_Type, min(BO_MSG.creation_date) as uCreation_Date\nFROM CALYPSODBA.BO_MESSAGE  BO_MSG\nWHERE BO_MSG.MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND BO_MSG.CREATION_DATE>= trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and BO_MSG.CREATION_DATE <trunc(TRUNC(SYSDATE , 'Month'), 'Month')\nand BO_MSG.EVENT_TYPE not in ('ALLOCATED_TRADE', 'CH_CLEARED_RATES_TRADE', 'DAY_ASSIGNED_TRADE', 'EXERCISED_TRADE', 'PARTIAL_TERM_TRADE', 'TERMINATED_TRADE', 'VERIFIED_TRADE', \n'DAY_PEND_MWTERM_TRADE', 'DAY_CLR_RATE_STP_TRADE', 'DAY_CLEARD_RATES_TRADE', 'PEND_MWTERM_TRADE')\nAND  BO_MSG.PRODUCT_FAMILY <> 'CreditDefaultSwap'\ngroup by BO_MSG.trade_id, BO_MSG.event_type, trunc(BO_MSG.creation_date)) BO_TRD_ET\ninner join (\nSelect ecn_msg.Trade_ID,  SWOriginalCounterparty, short_name as Counterparty, trade_status as Status, \ncase  product_type \nwhen 'Swap' then LEG1_PRINCIPAL_AMOUNT\nwhen 'Swaption' then LEG1_PRINCIPAL_AMOUNT\nwhen 'XCCySwap' then LEG1_PRINCIPAL_AMOUNT\nwhen 'FRA' then FRA_PRINCIPAL_AMOUNT\nwhen 'CapFloor' then CAP_FLOOR_AMOUNT\nelse Null\nend as NOMINAL,\ncase  product_type \nwhen 'Swap' then abs(LEG1_PRINCIPAL_AMOUNT)\nwhen 'Swaption' then abs(LEG1_PRINCIPAL_AMOUNT)\nwhen 'XCCySwap' then abs(LEG1_PRINCIPAL_AMOUNT)\nwhen 'FRA' then abs(FRA_PRINCIPAL_AMOUNT)\nwhen 'CapFloor' then abs(CAP_FLOOR_AMOUNT)\nelse Null\nend as ABS_NOMINAL, trade_price as Price, DESCRIPTION as Product_Description, product_type, product_sub_type, Product_SubType_Keywrd,  book_name as Book, INTERNAL_REFERENCE,  EXECUTION_DATETIME,  COMMENTS,  TRADE_CURRENCY, trade_date_time, SETTLEMENT_DATE, case quantity when 1 then 'Buy' when -1 then 'Sell' else NULL end as Buy_Sell, entered_date, ENTERED_USER, quantity, RATE_INDEX,  TRADER_NAME, CptyAttrib_BusinessType, \ncase  product_type \nwhen 'Swap' then \n(case leg1_FIXED_RATE\n when 0 then LEG2_FIXED_RATE\n else LEG1_FIXED_RATE end)\nwhen 'Swaption' then \n(case leg1_FIXED_RATE\n when 0 then LEG2_FIXED_RATE\n else LEG1_FIXED_RATE end)\nwhen 'XCCySwap' then \n(case leg1_FIXED_RATE\n when 0 then LEG2_FIXED_RATE\n else LEG1_FIXED_RATE end)\nwhen 'FRA' then FRA_FIXED_RATE\nelse Null\nend as FIXED_RATE,\nCptyAttrib_IMAGINE_SHORT_NAME, CptyAttrib_RED_SHORT_NAME,  EXERCISED_DATETIME, amendment_date,  TerminationTradeDate,  ExecutionVenueType,  PRODUCT_EXTENDED_TYPE, ecn_msg.product_id,CURRENCY, ECN_SOURCE,  ECN_BROKER_BIC, ReportingExecutionVenueType, PORTFOLIO_COMPRESSION, TransferTo, TransferFrom, LEI_CP, ExercisedUnder, Processing_Org, CPTY_ID, CCPTY_Flag, UNDERLYING_SWAP_CH,  Msg_Trade.PRODUCT_SUB_TYPE, Msg_Trade.PRODUCT_SUBTYPE_KEYWRD, Msg_Trade.BOOK, Msg_Trade.INTERNAL_REFERENCE, Msg_Trade.EXECUTION_DATETIME, Msg_Trade.COMMENTS, Msg_Trade.TRADE_CURRENCY, Msg_Trade.TRADE_DATE_TIME, Msg_Trade.SETTLEMENT_DATE, Msg_Trade.BUY_SELL, Msg_Trade.ENTERED_DATE, Msg_Trade.ENTERED_USER, Msg_Trade.QUANTITY, Msg_Trade.RATE_INDEX, Msg_Trade.TRADER_NAME, Msg_Trade.CPTYATTRIB_BUSINESSTYPE, Msg_Trade.FIXED_RATE, Msg_Trade.CPTYATTRIB_IMAGINE_SHORT_NAME, Msg_Trade.CPTYATTRIB_RED_SHORT_NAME, Msg_Trade.EXERCISED_DATETIME, Msg_Trade.AMENDMENT_DATE, Msg_Trade.TERMINATIONTRADEDATE, Msg_Trade.EXECUTIONVENUETYPE, Msg_Trade.PRODUCT_EXTENDED_TYPE, Msg_Trade.PRODUCT_ID, Msg_Trade.CURRENCY, Msg_Trade.ECN_SOURCE, Msg_Trade.ECN_BROKER_BIC, Msg_Trade.REPORTINGEXECUTIONVENUETYPE, Msg_Trade.PORTFOLIO_COMPRESSION, Msg_Trade.TRANSFERTO, Msg_Trade.TRANSFERFROM, Msg_Trade.LEI_CP, Msg_Trade.EXERCISEDUNDER, Msg_Trade.PROCESSING_ORG, \nMsg_Trade.UNDERLYING_SWAP_CH, \ntrunc(TRUNC(SYSDATE , 'Month')-1, 'Month') as Creation_Date_Start_Month, trunc(TRUNC(SYSDATE , 'Month') , 'Month')-1 as Creation_End_Month,\nsysdate as create_dte\nfrom\n(Select BM_Verified_Trade.Trade_ID as uTrade_ID,  BM_Verified_Trade.event_type as uEvent_Type, BM_Verified_Trade.CREATION_DATE as uCreation_Date\nfrom\n(Select BO_Counter.Trade_id, count( BO_Counter. event_type)\nfrom (\nSELECT BO_MSG.Trade_id, min(BO_MSG.event_type) as event_type, count(BO_MSG.event_type) as counter\nFROM CALYPSODBA.BO_MESSAGE  BO_MSG\nWHERE BO_MSG.MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND BO_MSG.CREATION_DATE>= trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and BO_MSG.CREATION_DATE < trunc(TRUNC(SYSDATE , 'Month'), 'Month')\nand BO_MSG.EVENT_TYPE in ('DAY_VERIFIED_TRADE' , 'DAY_VER_STP_TRADE') AND  BO_MSG.PRODUCT_FAMILY <> 'CreditDefaultSwap'\ngroup by BO_MSG.trade_id, event_type) BO_Counter\ngroup by BO_Counter.Trade_id\nhaving count( BO_Counter. event_type) = 1) BO_Sum\ninner join\n(\n\nSelect BM.trade_id, min(BM.CREATION_DATE) as CREATION_DATE, min(BM.event_type) as event_Type\nFROM CALYPSODBA.BO_MESSAGE BM\nWHERE BM.MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND BM.CREATION_DATE>= trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and BM.CREATION_DATE < trunc(TRUNC(SYSDATE , 'Month'), 'Month')\nand BM.EVENT_TYPE in ('DAY_VERIFIED_TRADE', 'DAY_VER_STP_TRADE') AND  BM.PRODUCT_FAMILY <> 'CreditDefaultSwap'\ngroup by BM.Trade_ID\n\n) BM_Verified_Trade\non BO_Sum.Trade_ID =  BM_Verified_Trade.Trade_ID\n\nUNION \n\nSELECT BO_MSG.Trade_id as uTrade_ID, BO_MSG.event_type as uEvent_Type, min(BO_MSG.creation_date) as uCreation_Date\nFROM CALYPSODBA.BO_MESSAGE  BO_MSG\nWHERE BO_MSG.MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND BO_MSG.CREATION_DATE>= trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and BO_MSG.CREATION_DATE <trunc(TRUNC(SYSDATE , 'Month'), 'Month')\nand BO_MSG.EVENT_TYPE not in ('ALLOCATED_TRADE', 'CH_CLEARED_RATES_TRADE', 'DAY_ASSIGNED_TRADE', 'EXERCISED_TRADE', 'PARTIAL_TERM_TRADE', 'TERMINATED_TRADE', 'VERIFIED_TRADE', \n'DAY_PEND_MWTERM_TRADE', 'DAY_CLR_RATE_STP_TRADE', 'DAY_CLEARD_RATES_TRADE', 'PEND_MWTERM_TRADE')\nAND  BO_MSG.PRODUCT_FAMILY <> 'CreditDefaultSwap'\ngroup by BO_MSG.trade_id, BO_MSG.event_type, trunc(BO_MSG.creation_date)) BO_TRD_ET\ninner join (\nSelect ecn_msg.Trade_ID,  SWOriginalCounterparty, short_name as Counterparty, trade_status as Status, \ncase  product_type \nwhen 'Swap' then LEG1_PRINCIPAL_AMOUNT\nwhen 'Swaption' then LEG1_PRINCIPAL_AMOUNT\nwhen 'XCCySwap' then LEG1_PRINCIPAL_AMOUNT\nwhen 'FRA' then FRA_PRINCIPAL_AMOUNT\nwhen 'CapFloor' then CAP_FLOOR_AMOUNT\nelse Null\nend as NOMINAL,\ncase  product_type \nwhen 'Swap' then abs(LEG1_PRINCIPAL_AMOUNT)\nwhen 'Swaption' then abs(LEG1_PRINCIPAL_AMOUNT)\nwhen 'XCCySwap' then abs(LEG1_PRINCIPAL_AMOUNT)\nwhen 'FRA' then abs(FRA_PRINCIPAL_AMOUNT)\nwhen 'CapFloor' then abs(CAP_FLOOR_AMOUNT)\nelse Null\nend as ABS_NOMINAL, trade_price as Price, DESCRIPTION as Product_Description, product_type, product_sub_type, Product_SubType_Keywrd,  book_name as Book, INTERNAL_REFERENCE,  EXECUTION_DATETIME,  COMMENTS,  TRADE_CURRENCY, trade_date_time, SETTLEMENT_DATE, case quantity when 1 then 'Buy' when -1 then 'Sell' else NULL end as Buy_Sell, entered_date, ENTERED_USER, quantity, RATE_INDEX,  TRADER_NAME, CptyAttrib_BusinessType, \ncase  product_type \nwhen 'Swap' then \n(case leg1_FIXED_RATE\n when 0 then LEG2_FIXED_RATE\n else LEG1_FIXED_RATE end)\nwhen 'Swaption' then \n(case leg1_FIXED_RATE\n when 0 then LEG2_FIXED_RATE\n else LEG1_FIXED_RATE end)\nwhen 'XCCySwap' then \n(case leg1_FIXED_RATE\n when 0 then LEG2_FIXED_RATE\n else LEG1_FIXED_RATE end)\nwhen 'FRA' then FRA_FIXED_RATE\nelse Null\nend as FIXED_RATE,\nCptyAttrib_IMAGINE_SHORT_NAME, CptyAttrib_RED_SHORT_NAME,  EXERCISED_DATETIME, amendment_date,  TerminationTradeDate,  ExecutionVenueType,  PRODUCT_EXTENDED_TYPE, ecn_msg.product_id,CURRENCY, ECN_SOURCE,  ECN_BROKER_BIC, ReportingExecutionVenueType, PORTFOLIO_COMPRESSION, TransferTo, TransferFrom, LEI_CP, ExercisedUnder, Processing_Org, CPTY_ID, CCPTY_Flag, UNDERLYING_SWAP_CH, LE_INTERNAL\nfrom\n(Select trade.Trade_ID, trade.trade_status, trade.trade_date_time, trade.entered_date, trade.ENTERED_USER, trade.SETTLEMENT_DATE, trade.quantity, trade.TRADE_CURRENCY, trade.trade_price, trade.TRADER_NAME, trade.CPTY_ID, trade.COMMENTS, trade. INTERNAL_REFERENCE, trade.book_id, trade.product_id, book.book_name, prod.product_type, prod.product_sub_type, prod.PRODUCT_EXTENDED_TYPE, prod.DESCRIPTION, prod.CURRENCY, prod.RATE_INDEX,  legEnt.short_name, legEntBook.Short_Name as Processing_Org\nfrom CALYPSODBA.TRADE trade\ninner join CALYPSODBA.book book on book.book_id = trade.book_id\ninner join CALYPSODBA.PRODUCT_DESC prod on prod.product_id = trade.product_id\ninner join CALYPSODBA.LEGAL_ENTITY legEnt on legEnt.LEGAL_ENTITY_ID = trade.cpty_id\ninner join CALYPSODBA.LEGAL_ENTITY legEntBook on legEntBook.LEGAL_ENTITY_ID = book.LEGAL_ENTITY_ID\nwhere book.book_name not in ('ECN_MATCHING', 'ECN_CHARLOTTE',  'ECN_MATCHING_LDN', 'ECN_MATCHING_WEST') and trade.trade_status not in ('FO_ERR_REMOVED') and trade.trade_ID in (\nSELECT distinct TRADE_ID \nFROM CALYPSODBA.BO_MESSAGE\nWHERE MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND  PRODUCT_FAMILY <> 'CreditDefaultSwap' AND  CREATION_DATE>=  trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and CREATION_DATE < trunc(TRUNC(SYSDATE , 'Month'), 'Month'))) ecn_msg\nleft join \n(\nSelect trade_id,  amendment_date, case when amend_Mnth_Yr=Rpt_Amend_Mnt_Yr then 'VALID' else 'INVALID' end as Amend_Time_Flag,  case when (amend_new_day > = iso_week_start_dte and  amend_new_day < iso_week_end_dte) then 'VALID_W' else 'INVALID_W' end as Amend_Wkly_flag\nfrom\n(\nSelect trade_id, keyword_value as amendment_date, \ncase when instr(keyword_value, '/') = 0 then\n(substr(keyword_value, 1, 2) || '-' || substr(keyword_value, 7, 4) )\n when instr(keyword_value, '/') > 0 then \n(case length(substr(keyword_value, 1, instr(keyword_value, '/')-1)) when 1 then '0' || substr(keyword_value, 1, instr(keyword_value, '/')-1) when 2 then substr(keyword_value, 1, instr(keyword_value, '/')-1) end ) || '-'|| (Case substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) when '20' then '20' ||  substr(keyword_value, instr(keyword_value, '/', 1, 2)+3, 2)  else '20' || substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) end) end as amend_Mnth_Yr, TO_CHAR(TRUNC(LAST_DAY(ADD_MONTHS(SYSDATE,-1))+1),'MM-YYYY')  as Rpt_Amend_Mnt_Yr,\ncase when instr(keyword_value, '/') = 0 then\n(substr(keyword_value, 7, 4) || '-'|| substr(keyword_value, 1, 2) || '-' || substr(keyword_value, 4, 2))\n when instr(keyword_value, '/') > 0 then \n (Case substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) when '20' then '20' ||  substr(keyword_value, instr(keyword_value, '/', 1, 2)+3, 2)  else '20' || substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) end) || '-'||  (case length(substr(keyword_value, 1, instr(keyword_value, '/')-1)) when 1 then '0' || substr(keyword_value, 1, instr(keyword_value, '/')-1) when 2 then substr(keyword_value, 1, instr(keyword_value, '/')-1) end ) ||'-'||\n(case length(substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1))) when 1 then '0' || substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) when 2 then substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) end ) end as amend_Day,\nto_date(to_char(case when instr(keyword_value, '/') = 0 then\n(substr(keyword_value, 7, 4) || '-'|| substr(keyword_value, 1, 2) || '-' || substr(keyword_value, 4, 2))\n when instr(keyword_value, '/') > 0 then \n (Case substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) when '20' then '20' ||  substr(keyword_value, instr(keyword_value, '/', 1, 2)+3, 2)  else '20' || substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) end) || '-'||  (case length(substr(keyword_value, 1, instr(keyword_value, '/')-1)) when 1 then '0' || substr(keyword_value, 1, instr(keyword_value, '/')-1) when 2 then substr(keyword_value, 1, instr(keyword_value, '/')-1) end ) ||'-'||\n(case length(substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1))) when 1 then '0' || substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) when 2 then substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) end ) end), 'YYYY-MM-DD') as amend_new_day,  trunc(SYSDATE), TRUNC(sysdate-7, 'iw') AS iso_week_start_dte, TRUNC(sysdate-7, 'iw') + 7 AS iso_week_end_dte\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere keyword_name = 'AmendmentDate')) amend_Date_KWD\non amend_Date_KWD.trade_id = ecn_msg.trade_id\n\nleft join\n(Select trade_id, keyword_value as ECN_BROKER_BIC\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere keyword_name = 'ECN_BROKER_BIC') ECN_BROKER_BIC_KWD\non ECN_BROKER_BIC_KWD.trade_id = ecn_msg.trade_id\nleft join\n(Select trade_id, keyword_value as ECN_SOURCE\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere upper(keyword_name) like 'ECN_SOURCE') ECN_SOURCE_KWD\non ECN_SOURCE_KWD.trade_id = ecn_msg.trade_id\nleft join\n(\nSelect trade_id, EXECUTION_DATETIME, case when Execute_Yr_Mnth=Rpt_Exec_Yr_Mnth then 'VALID' else 'INVALID' end as Execute_Time_Flag, case when (Execute_Day > = iso_week_start_dte and Execute_Day< iso_week_end_dte) then 'VALID_W' else 'INVALID_W' end as Execute_wkly_flag\nfrom\n(Select trade_id, keyword_value as EXECUTION_DATETIME, substr(keyword_value, 1, 7) as Execute_Yr_Mnth, TO_CHAR(TRUNC(LAST_DAY(ADD_MONTHS(SYSDATE,-1))+1), 'YYYY-MM')  as Rpt_Exec_Yr_Mnth, to_date(to_char(substr(keyword_value, 1, 10)), 'YYYY-MM-DD') as Execute_Day, TRUNC(sysdate-7, 'iw') AS iso_week_start_dte, TRUNC(sysdate-7, 'iw') + 7 AS iso_week_end_dte\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere upper(keyword_name) like 'EXECUTION_DATETIME')) EXECUTION_DATETIME_KWD\non EXECUTION_DATETIME_KWD.trade_id = ecn_msg.trade_id\n\nleft join\n(Select trade_id, keyword_value as ExecutionVenueType\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere keyword_name =  'ExecutionVenueType') EXECUTION_VENUE_KWD\non EXECUTION_VENUE_KWD.Trade_ID = ecn_msg.trade_id\nleft join\n(\nSelect trade_id, EXERCISED_DATETIME, case when Exercised_Mtnh_Yr=Rpt_Mnt_Yr  then 'VALID' else 'INVALID' end as Exerc_Time_Flag, case when (exercise_new_day > = iso_week_start_dte and  exercise_new_day < iso_week_end_dte) then 'VALID_W' else 'INVALID_W' end as Exercise_Wkly_flag\nfrom(\nSelect trade_id, keyword_value as EXERCISED_DATETIME, \n(case length(substr(keyword_value, 1, instr(keyword_value, '/')-1)) when 1 then '0' || substr(keyword_value, 1, instr(keyword_value, '/')-1) when 2 then substr(keyword_value, 1, instr(keyword_value, '/')-1) end ) || '-'|| (Case substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) when '20' then '20' ||  substr(keyword_value, instr(keyword_value, '/', 1, 2)+3, 2)  else '20' || substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) end) as Exercised_Mtnh_Yr, \nTO_CHAR(TRUNC(LAST_DAY(ADD_MONTHS(SYSDATE,-1))+1),'MM-YYYY')  as Rpt_Mnt_Yr, \n (Case substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) when '20' then '20' ||  substr(keyword_value, instr(keyword_value, '/', 1, 2)+3, 2)  else '20' || substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) end) || '-'||  (case length(substr(keyword_value, 1, instr(keyword_value, '/')-1)) when 1 then '0' || substr(keyword_value, 1, instr(keyword_value, '/')-1) when 2 then substr(keyword_value, 1, instr(keyword_value, '/')-1) end ) ||'-'||\n(case length(substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1))) when 1 then '0' || substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) when 2 then substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) end) as exercise_day,\nto_date(to_char((Case substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) when '20' then '20' ||  substr(keyword_value, instr(keyword_value, '/', 1, 2)+3, 2)  else '20' || substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) end) || '-'||  (case length(substr(keyword_value, 1, instr(keyword_value, '/')-1)) when 1 then '0' || substr(keyword_value, 1, instr(keyword_value, '/')-1) when 2 then substr(keyword_value, 1, instr(keyword_value, '/')-1) end ) ||'-'||\n(case length(substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1))) when 1 then '0' || substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) when 2 then substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) end)) , 'YYYY-mm-dd') as exercise_n Trade.event_type as uEvent_Type, BM_Verified_Trade.CREATION_DATE as uCreation_Date\nfrom\n(Select BO_Counter.Trade_id, count( BO_Counter. event_type)\nfrom (\nSELECT BO_MSG.Trade_id, min(BO_MSG.event_type) as event_type, count(BO_MSG.event_type) as counter\nFROM CALYPSODBA.BO_MESSAGE  BO_MSG\nWHERE BO_MSG.MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND BO_MSG.CREATION_DATE>= trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and BO_MSG.CREATION_DATE < trunc(TRUNC(SYSDATE , 'Month'), 'Month')\nand BO_MSG.EVENT_TYPE in ('DAY_VERIFIED_TRADE' , 'DAY_VER_STP_TRADE') AND  BO_MSG.PRODUCT_FAMILY <> 'CreditDefaultSwap'\ngroup by BO_MSG.trade_id, event_type) BO_Counter\ngroup by BO_Counter.Trade_id\nhaving count( BO_Counter. event_type) = 1) BO_Sum\ninner join\n(\n\nSelect BM.trade_id, min(BM.CREATION_DATE) as CREATION_DATE, min(BM.event_type) as event_Type\nFROM CALYPSODBA.BO_MESSAGE BM\nWHERE BM.MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND BM.CREATION_DATE>= trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and BM.CREATION_DATE < trunc(TRUNC(SYSDATE , 'Month'), 'Month')\nand BM.EVENT_TYPE in ('DAY_VERIFIED_TRADE', 'DAY_VER_STP_TRADE') AND  BM.PRODUCT_FAMILY <> 'CreditDefaultSwap'\ngroup by BM.Trade_ID\n\n) BM_Verified_Trade\non BO_Sum.Trade_ID =  BM_Verified_Trade.Trade_ID\n\nUNION \n\nSELECT BO_MSG.Trade_id as uTrade_ID, BO_MSG.event_type as uEvent_Type, min(BO_MSG.creation_date) as uCreation_Date\nFROM CALYPSODBA.BO_MESSAGE  BO_MSG\nWHERE BO_MSG.MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND BO_MSG.CREATION_DATE>= trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and BO_MSG.CREATION_DATE <trunc(TRUNC(SYSDATE , 'Month'), 'Month')\nand BO_MSG.EVENT_TYPE not in ('ALLOCATED_TRADE', 'CH_CLEARED_RATES_TRADE', 'DAY_ASSIGNED_TRADE', 'EXERCISED_TRADE', 'PARTIAL_TERM_TRADE', 'TERMINATED_TRADE', 'VERIFIED_TRADE', \n'DAY_PEND_MWTERM_TRADE', 'DAY_CLR_RATE_STP_TRADE', 'DAY_CLEARD_RATES_TRADE', 'PEND_MWTERM_TRADE')\nAND  BO_MSG.PRODUCT_FAMILY <> 'CreditDefaultSwap'\ngroup by BO_MSG.trade_id, BO_MSG.event_type, trunc(BO_MSG.creation_date)) BO_TRD_ET\ninner join (\nSelect ecn_msg.Trade_ID,  SWOriginalCounterparty, short_name as Counterparty, trade_status as Status, \ncase  product_type \nwhen 'Swap' then LEG1_PRINCIPAL_AMOUNT\nwhen 'Swaption' then LEG1_PRINCIPAL_AMOUNT\nwhen 'XCCySwap' then LEG1_PRINCIPAL_AMOUNT\nwhen 'FRA' then FRA_PRINCIPAL_AMOUNT\nwhen 'CapFloor' then CAP_FLOOR_AMOUNT\nelse Null\nend as NOMINAL,\ncase  product_type \nwhen 'Swap' then abs(LEG1_PRINCIPAL_AMOUNT)\nwhen 'Swaption' then abs(LEG1_PRINCIPAL_AMOUNT)\nwhen 'XCCySwap' then abs(LEG1_PRINCIPAL_AMOUNT)\nwhen 'FRA' then abs(FRA_PRINCIPAL_AMOUNT)\nwhen 'CapFloor' then abs(CAP_FLOOR_AMOUNT)\nelse Null\nend as ABS_NOMINAL, trade_price as Price, DESCRIPTION as Product_Description, product_type, product_sub_type, Product_SubType_Keywrd,  book_name as Book, INTERNAL_REFERENCE,  EXECUTION_DATETIME,  COMMENTS,  TRADE_CURRENCY, trade_date_time, SETTLEMENT_DATE, case quantity when 1 then 'Buy' when -1 then 'Sell' else NULL end as Buy_Sell, entered_date, ENTERED_USER, quantity, RATE_INDEX,  TRADER_NAME, CptyAttrib_BusinessType, \ncase  product_type \nwhen 'Swap' then \n(case leg1_FIXED_RATE\n when 0 then LEG2_FIXED_RATE\n else LEG1_FIXED_RATE end)\nwhen 'Swaption' then \n(case leg1_FIXED_RATE\n when 0 then LEG2_FIXED_RATE\n else LEG1_FIXED_RATE end)\nwhen 'XCCySwap' then \n(case leg1_FIXED_RATE\n when 0 then LEG2_FIXED_RATE\n else LEG1_FIXED_RATE end)\nwhen 'FRA' then FRA_FIXED_RATE\nelse Null\nend as FIXED_RATE,\nCptyAttrib_IMAGINE_SHORT_NAME, CptyAttrib_RED_SHORT_NAME,  EXERCISED_DATETIME, amendment_date,  TerminationTradeDate,  ExecutionVenueType,  PRODUCT_EXTENDED_TYPE, ecn_msg.product_id,CURRENCY, ECN_SOURCE,  ECN_BROKER_BIC, ReportingExecutionVenueType, PORTFOLIO_COMPRESSION, TransferTo, TransferFrom, LEI_CP, ExercisedUnder, Processing_Org, CPTY_ID, CCPTY_Flag, UNDERLYING_SWAP_CH, LE_INTERNAL\nfrom\n(Select trade.Trade_ID, trade.trade_status, trade.trade_date_time, trade.entered_date, trade.ENTERED_USER, trade.SETTLE dificationStatus":"NONE","typeProperties":[{"key":"SQL_QUERY","name":"Sql_Query","value":"select BO_TRD_ET.UTRADE_ID as Trade_ID, BO_TRD_ET.UEVENT_TYPE as event_Type ,BO_TRD_ET.UCREATION_DATE as creation_date , Msg_Trade.SWORIGINALCOUNTERPARTY, Msg_Trade.COUNTERPARTY,  CCPTY_Flag, \n\ncase when Msg_Trade.Status = 'CH_CLEARED_RATES' AND Msg_Trade.TRANSFERTO is not NULL and BO_TRD_ET.UEVENT_TYPE = 'DAY_VERIFIED_TRADE' then Msg_Trade.SWORIGINALCOUNTERPARTY else Msg_Trade.COUNTERPARTY end as NewcounterParty,\n\nMsg_Trade.STATUS, Msg_Trade.NOMINAL, Msg_Trade.ABS_NOMINAL, Msg_Trade.PRICE, Msg_Trade.PRODUCT_DESCRIPTION, Msg_Trade.PRODUCT_TYPE, Msg_Trade.PRODUCT_SUB_TYPE, Msg_Trade.PRODUCT_SUBTYPE_KEYWRD, Msg_Trade.BOOK, Msg_Trade.INTERNAL_REFERENCE, Msg_Trade.EXECUTION_DATETIME, Msg_Trade.COMMENTS, Msg_Trade.TRADE_CURRENCY, Msg_Trade.TRADE_DATE_TIME, Msg_Trade.SETTLEMENT_DATE, Msg_Trade.BUY_SELL, Msg_Trade.ENTERED_DATE, Msg_Trade.ENTERED_USER, Msg_Trade.QUANTITY, Msg_Trade.RATE_INDEX, Msg_Trade.TRADER_NAME, Msg_Trade.CPTYATTRIB_BUSINESSTYPE, Msg_Trade.FIXED_RATE, Msg_Trade.CPTYATTRIB_IMAGINE_SHORT_NAME, Msg_Trade.CPTYATTRIB_RED_SHORT_NAME, Msg_Trade.EXERCISED_DATETIME, Msg_Trade.AMENDMENT_DATE, Msg_Trade.TERMINATIONTRADEDATE, Msg_Trade.EXECUTIONVENUETYPE, Msg_Trade.PRODUCT_EXTENDED_TYPE, Msg_Trade.PRODUCT_ID, Msg_Trade.CURRENCY, Msg_Trade.ECN_SOURCE, Msg_Trade.ECN_BROKER_BIC, Msg_Trade.REPORTINGEXECUTIONVENUETYPE, Msg_Trade.PORTFOLIO_COMPRESSION, Msg_Trade.TRANSFERTO, Msg_Trade.TRANSFERFROM, Msg_Trade.LEI_CP, Msg_Trade.EXERCISEDUNDER, Msg_Trade.PROCESSING_ORG, \nMsg_Trade.UNDERLYING_SWAP_CH, \ntrunc(TRUNC(SYSDATE , 'Month')-1, 'Month') as Creation_Date_Start_Month, trunc(TRUNC(SYSDATE , 'Month') , 'Month')-1 as Creation_End_Month,\nsysdate as create_dte\nfrom\n(Select BM_Verified_Trade.Trade_ID as uTrade_ID,  BM_Verified_Trade.event_type as uEvent_Type, BM_Verified_Trade.CREATION_DATE as uCreation_Date\nfrom\n(Select BO_Counter.Trade_id, count( BO_Counter. event_type)\nfrom (\nSELECT BO_MSG.Trade_id, min(BO_MSG.event_type) as event_type, count(BO_MSG.event_type) as counter\nFROM CALYPSODBA.BO_MESSAGE  BO_MSG\nWHERE BO_MSG.MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND BO_MSG.CREATION_DATE>= trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and BO_MSG.CREATION_DATE < trunc(TRUNC(SYSDATE , 'Month'), 'Month')\nand BO_MSG.EVENT_TYPE in ('DAY_VERIFIED_TRADE' , 'DAY_VER_STP_TRADE') AND  BO_MSG.PRODUCT_FAMILY <> 'CreditDefaultSwap'\ngroup by BO_MSG.trade_id, event_type) BO_Counter\ngroup by BO_Counter.Trade_id\nhaving count( BO_Counter. event_type) = 1) BO_Sum\ninner join\n(\n\nSelect BM.trade_id, min(BM.CREATION_DATE) as CREATION_DATE, min(BM.event_type) as event_Type\nFROM CALYPSODBA.BO_MESSAGE BM\nWHERE BM.MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND BM.CREATION_DATE>= trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and BM.CREATION_DATE < trunc(TRUNC(SYSDATE , 'Month'), 'Month')\nand BM.EVENT_TYPE in ('DAY_VERIFIED_TRADE', 'DAY_VER_STP_TRADE') AND  BM.PRODUCT_FAMILY <> 'CreditDefaultSwap'\ngroup by BM.Trade_ID\n\n) BM_Verified_Trade\non BO_Sum.Trade_ID =  BM_Verified_Trade.Trade_ID\n\nUNION \n\nSELECT BO_MSG.Trade_id as uTrade_ID, BO_MSG.event_type as uEvent_Type, min(BO_MSG.creation_date) as uCreation_Date\nFROM CALYPSODBA.BO_MESSAGE  BO_MSG\nWHERE BO_MSG.MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND BO_MSG.CREATION_DATE>= trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and BO_MSG.CREATION_DATE <trunc(TRUNC(SYSDATE , 'Month'), 'Month')\nand BO_MSG.EVENT_TYPE not in ('ALLOCATED_TRADE', 'CH_CLEARED_RATES_TRADE', 'DAY_ASSIGNED_TRADE', 'EXERCISED_TRADE', 'PARTIAL_TERM_TRADE', 'TERMINATED_TRADE', 'VERIFIED_TRADE', \n'DAY_PEND_MWTERM_TRADE', 'DAY_CLR_RATE_STP_TRADE', 'DAY_CLEARD_RATES_TRADE', 'PEND_MWTERM_TRADE')\nAND  BO_MSG.PRODUCT_FAMILY <> 'CreditDefaultSwap'\ngroup by BO_MSG.trade_id, BO_MSG.event_type, trunc(BO_MSG.creation_date)) BO_TRD_ET\ninner join (\nSelect ecn_msg.Trade_ID,  SWOriginalCounterparty, short_name as Counterparty, trade_status as Status, \ncase  product_type \nwhen 'Swap' then LEG1_PRINCIPAL_AMOUNT\nwhen 'Swaption' then LEG1_PRINCIPAL_AMOUNT\nwhen 'XCCySwap' then LEG1_PRINCIPAL_AMOUNT\nwhen 'FRA' then FRA_PRINCIPAL_AMOUNT\nwhen 'CapFloor' then CAP_FLOOR_AMOUNT\nelse Null\nend as NOMINAL,\ncase  product_type \nwhen 'Swap' then abs(LEG1_PRINCIPAL_AMOUNT)\nwhen 'Swaption' then abs(LEG1_PRINCIPAL_AMOUNT)\nwhen 'XCCySwap' then abs(LEG1_PRINCIPAL_AMOUNT)\nwhen 'FRA' then abs(FRA_PRINCIPAL_AMOUNT)\nwhen 'CapFloor' then abs(CAP_FLOOR_AMOUNT)\nelse Null\nend as ABS_NOMINAL, trade_price as Price, DESCRIPTION as Product_Description, product_type, product_sub_type, Product_SubType_Keywrd,  book_name as Book, INTERNAL_REFERENCE,  EXECUTION_DATETIME,  COMMENTS,  TRADE_CURRENCY, trade_date_time, SETTLEMENT_DATE, case quantity when 1 then 'Buy' when -1 then 'Sell' else NULL end as Buy_Sell, entered_date, ENTERED_USER, quantity, RATE_INDEX,  TRADER_NAME, CptyAttrib_BusinessType, \ncase  product_type \nwhen 'Swap' then \n(case leg1_FIXED_RATE\n when 0 then LEG2_FIXED_RATE\n else LEG1_FIXED_RATE end)\nwhen 'Swaption' then \n(case leg1_FIXED_RATE\n when 0 then LEG2_FIXED_RATE\n else LEG1_FIXED_RATE end)\nwhen 'XCCySwap' then \n(case leg1_FIXED_RATE\n when 0 then LEG2_FIXED_RATE\n else LEG1_FIXED_RATE end)\nwhen 'FRA' then FRA_FIXED_RATE\nelse Null\nend as FIXED_RATE,\nCptyAttrib_IMAGINE_SHORT_NAME, CptyAttrib_RED_SHORT_NAME,  EXERCISED_DATETIME, amendment_date,  TerminationTradeDate,  ExecutionVenueType,  PRODUCT_EXTENDED_TYPE, ecn_msg.product_id,CURRENCY, ECN_SOURCE,  ECN_BROKER_BIC, ReportingExecutionVenueType, PORTFOLIO_COMPRESSION, TransferTo, TransferFrom, LEI_CP, ExercisedUnder, Processing_Org, CPTY_ID, CCPTY_Flag, UNDERLYING_SWAP_CH, LE_INTERNAL\nfrom\n(Select trade.Trade_ID, trade.trade_status, trade.trade_date_time, trade.entered_date, trade.ENTERED_USER, trade.SETTLEMENT_DATE, trade.quantity, trade.TRADE_CURRENCY, trade.trade_price, trade.TRADER_NAME, trade.CPTY_ID, trade.COMMENTS, trade. INTERNAL_REFERENCE, trade.book_id, trade.product_id, book.book_name, prod.product_type, prod.product_sub_type, prod.PRODUCT_EXTENDED_TYPE, prod.DESCRIPTION, prod.CURRENCY, prod.RATE_INDEX,  legEnt.short_name, legEntBook.Short_Name as Processing_Org\nfrom CALYPSODBA.TRADE trade\ninner join CALYPSODBA.book book on book.book_id = trade.book_id\ninner join CALYPSODBA.PRODUCT_DESC prod on prod.product_id = trade.product_id\ninner join CALYPSODBA.LEGAL_ENTITY legEnt on legEnt.LEGAL_ENTITY_ID = trade.cpty_id\ninner join CALYPSODBA.LEGAL_ENTITY legEntBook on legEntBook.LEGAL_ENTITY_ID = book.LEGAL_ENTITY_ID\nwhere book.book_name not in ('ECN_MATCHING', 'ECN_CHARLOTTE',  'ECN_MATCHING_LDN', 'ECN_MATCHING_WEST') and trade.trade_status not in ('FO_ERR_REMOVED') and trade.trade_ID in (\nSELECT distinct TRADE_ID \nFROM CALYPSODBA.BO_MESSAGE\nWHERE MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND  PRODUCT_FAMILY <> 'CreditDefaultSwap' AND  CREATION_DATE>=  trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and CREATION_DATE < trunc(TRUNC(SYSDATE , 'Month'), 'Month'))) ecn_msg\nleft join \n(\nSelect trade_id,  amendment_date, case when amend_Mnth_Yr=Rpt_Amend_Mnt_Yr then 'VALID' else 'INVALID' end as Amend_Time_Flag,  case when (amend_new_day > = iso_week_start_dte and  amend_new_day < iso_week_end_dte) then 'VALID_W' else 'INVALID_W' end as Amend_Wkly_flag\nfrom\n(\nSelect trade_id, keyword_value as amendment_date, \ncase when instr(keyword_value, '/') = 0 then\n(substr(keyword_value, 1, 2) || '-' || substr(keyword_value, 7, 4) )\n when instr(keyword_value, '/') > 0 then \n(case length(substr(keyword_value, 1, instr(keyword_value, '/')-1)) when 1 then '0' || substr(keyword_value, 1, instr(keyword_value, '/')-1) when 2 then substr(keyword_value, 1, instr(keyword_value, '/')-1) end ) || '-'|| (Case substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) when '20' then '20' ||  substr(keyword_value, instr(keyword_value, '/', 1, 2)+3, 2)  else '20' || substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) end) end as eyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) when 2 then substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) end ) end), 'YYYY-MM-DD') as amend_new_day,  trunc(SYSDATE), TRUNC(sysdate-7, 'iw') AS iso_week_start_dte, TRUNC(sysdate-7, 'iw') + 7 AS iso_week_end_dte\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere keyword_name = 'AmendmentDate')) amend_Date_KWD\non amend_Date_KWD.trade_id = ecn_msg.trade_id\n\nleft join\n(Select trade_id, keyword_value as ECN_BROKER_BIC\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere keyword_name = 'ECN_BROKER_BIC') ECN_BROKER_BIC_KWD\non ECN_BROKER_BIC_KWD.trade_id = ecn_msg.trade_id\nleft join\n(Select trade_id, keyword_value as ECN_SOURCE\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere upper(keyword_name) like 'ECN_SOURCE') ECN_SOURCE_KWD\non ECN_SOURCE_KWD.trade_id = ecn_msg.trade_id\nleft join\n(\nSelect trade_id, EXECUTION_DATETIME, case when Execute_Yr_Mnth=Rpt_Exec_Yr_Mnth then 'VALID' else 'INVALID' end as Execute_Time_Flag, case when (Execute_Day > = iso_week_start_dte and Execute_Day< iso_week_end_dte) then 'VALID_W' else 'INVALID_W' end as Execute_wkly_flag\nfrom\n(Select trade_id, keyword_value as EXECUTION_DATETIME, substr(keyword_value, 1, 7) as Execute_Yr_Mnth, TO_CHAR(TRUNC(LAST_DAY(ADD_MONTHS(SYSDATE,-1))+1), 'YYYY-MM')  as Rpt_Exec_Yr_Mnth, to_date(to_char(substr(keyword_value, 1, 10)), 'YYYY-MM-DD') as Execute_Day, TRUNC(sysdate-7, 'iw') AS iso_week_start_dte, TRUNC(sysdate-7, 'iw') + 7 AS iso_week_end_dte\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere upper(keyword_name) like 'EXECUTION_DATETIME')) EXECUTION_DATETIME_KWD\non EXECUTION_DATETIME_KWD.trade_id = ecn_msg.trade_id\n\nleft join\n(Select trade_id, keyword_value as ExecutionVenueType\nfrom CALYPSODBA.TRADE_KEYWORD\nwhere keyword_name =  'ExecutionVenueType') EXECUTION_VENUE_KWD\non EXECUTION_VENUE_KWD.Trade_ID = ecn_msg.trade_id\nleft join\n(\nSelect trade_id, EXERCISED_DATE e.Trade_ID, trade.trade_status, trade.trade_date_time, trade.entered_date, trade.ENTERED_USER, trade.SETTLEMENT_DATE, trade.quantity, trade.TRADE_CURRENCY, trade.trade_price, trade.TRADER_NAME, trade.CPTY_ID, trade.COMMENTS, trade. INTERNAL_REFERENCE, trade.book_id, trade.product_id, book.book_name, prod.product_type, prod.product_sub_type, prod.PRODUCT_EXTENDED_TYPE, prod.DESCRIPTION, prod.CURRENCY, prod.RATE_INDEX,  legEnt.short_name, legEntBook.Short_Name as Processing_Org\nfrom CALYPSODBA.TRADE trade\ninner join CALYPSODBA.book book on book.book_id = trade.book_id\ninner join CALYPSODBA.PRODUCT_DESC prod on prod.product_id = trade.product_id\ninner join CALYPSODBA.LEGAL_ENTITY legEnt on legEnt.LEGAL_ENTITY_ID = trade.cpty_id\ninner join CALYPSODBA.LEGAL_ENTITY legEntBook on legEntBook.LEGAL_ENTITY_ID = book.LEGAL_ENTITY_ID\nwhere book.book_name not in ('ECN_MATCHING', 'ECN_CHARLOTTE',  'ECN_MATCHING_LDN', 'ECN_MATCHING_WEST') and trade.trade_status not in ('FO_ERR_REMOVED') and trade.trade_ID in (\nSELECT distinct TRADE_ID \nFROM CALYPSODBA.BO_MESSAGE\nWHERE MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND  PRODUCT_FAMILY <> 'CreditDefaultSwap' AND  CREATION_DATE>=  trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and CREATION_DATE < trunc(TRUNC(SYSDATE , 'Month'), 'Month'))) ecn_msg\nleft join \n(\nSelect trade_id,  amendment_date, case when amend_Mnth_Yr=Rpt_Amend_Mnt_Yr then 'VALID' else 'INVALID' end as Amend_Time_Flag,  case when (amend_new_day > = iso_week_start_dte and  amend_new_day < iso_week_end_dte) then 'VALID_W' else 'INVALID_W' end as Amend_Wkly_flag\nfrom\n(\nSelect trade_id, keyword_value as amendment_date, \ncase when instr(keyword_value, '/') = 0 then\n(substr(keyword_value, 1, 2) || '-' || substr(keyword_value, 7, 4) )\n when instr(keyword_value, '/') > 0 then \n(case length(substr(keyword_value, 1, instr(keyword_value, '/')-1)) when 1 then '0' || substr(keyword_value, 1, instr(keyword_value, '/')-1) when 2 then substr(keyword_value, 1, instr(keyword_value NE","typeProperties":[{"key":"SQL_QUERY","name":"Sql_Query","value":"select BO_TRD_ET.UTRADE_ID as Trade_ID, BO_TRD_ET.UEVENT_TYPE as event_Type ,BO_TRD_ET.UCREATION_DATE as creation_date , Msg_Trade.SWORIGINALCOUNTERPARTY, Msg_Trade.COUNTERPARTY,  CCPTY_Flag, \n\ncase when Msg_Trade.Status = 'CH_CLEARED_RATES' AND Msg_Trade.TRANSFERTO is not NULL and BO_TRD_ET.UEVENT_TYPE = 'DAY_VERIFIED_TRADE' then Msg_Trade.SWORIGINALCOUNTERPARTY else Msg_Trade.COUNTERPARTY end as NewcounterParty,\n\nMsg_Trade.STATUS, Msg_Trade.NOMINAL, Msg_Trade.ABS_NOMINAL, Msg_Trade.PRICE, Msg_Trade.PRODUCT_DESCRIPTION, Msg_Trade.PRODUCT_TYPE, Msg_Trade.PRODUCT_SUB_TYPE, Msg_Trade.PRODUCT_SUBTYPE_KEYWRD, Msg_Trade.BOOK, Msg_Trade.INTERNAL_REFERENCE, Msg_Trade.EXECUTION_DATETIME, Msg_Trade.COMMENTS, Msg_Trade.TRADE_CURRENCY, Msg_Trade.TRADE_DATE_TIME, Msg_Trade.SETTLEMENT_DATE, Msg_Trade.BUY_SELL, Msg_Trade.ENTERED_DATE, Msg_Trade.ENTERED_USER, Msg_Trade.QUANTITY, Msg_Trade.RATE_INDEX, Msg_Trade.TRADER_NAME, Msg_Trade.CPTYATTRIB_BUSINESSTYPE, Msg_Trade.FIXED_RATE, Msg_Trade.CPTYATTRIB_IMAGINE_SHORT_NAME, Msg_Trade.CPTYATTRIB_RED_SHORT_NAME, Msg_Trade.EXERCISED_DATETIME, Msg_Trade.AMENDMENT_DATE, Msg_Trade.TERMINATIONTRADEDATE, Msg_Trade.EXECUTIONVENUETYPE, Msg_Trade.PRODUCT_EXTENDED_TYPE, Msg_Trade.PRODUCT_ID, Msg_Trade.CURRENCY, Msg_Trade.ECN_SOURCE, Msg_Trade.ECN_BROKER_BIC, Msg_Trade.REPORTINGEXECUTIONVENUETYPE, Msg_Trade.PORTFOLIO_COMPRESSION, Msg_Trade.TRANSFERTO, Msg_Trade.TRANSFERFROM, Msg_Trade.LEI_CP, Msg_Trade.EXERCISEDUNDER, Msg_Trade.PROCESSING_ORG, \nMsg_Trade.UNDERLYING_SWAP_CH, \ntrunc(TRUNC(SYSDATE , 'Month')-1, 'Month') as Creation_Date_Start_Month, trunc(TRUNC(SYSDATE , 'Month') , 'Month')-1 as Creation_End_Month,\nsysdate as create_dte\nfrom\n(Select BM_Verified_Trade.Trade_ID as uTrade_ID,  BM_Verified_Trade.event_type as uEvent_Type, BM_Verified_Trade.CREATION_DATE as uCreation_Date\nfrom\n(Select BO_Counter.Trade_id, count( BO_Counter. event_type)\nfrom (\nSELECT BO_MSG.Trade_id, min(BO_MSG.event_type) as event_type, count(BO_MSG.event_type) as counter\nFROM CALYPSODBA.BO_MESSAGE  BO_MSG\nWHERE BO_MSG.MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND BO_MSG.CREATION_DATE>= trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and BO_MSG.CREATION_DATE < trunc(TRUNC(SYSDATE , 'Month'), 'Month')\nand BO_MSG.EVENT_TYPE in ('DAY_VERIFIED_TRADE' , 'DAY_VER_STP_TRADE') AND  BO_MSG.PRODUCT_FAMILY <> 'CreditDefaultSwap'\ngroup by BO_MSG.trade_id, event_type) BO_Counter\ngroup by BO_Counter.Trade_id\nhaving count( BO_Counter. event_type) = 1) BO_Sum\ninner join\n(\n\nSelect BM.trade_id, min(BM.CREATION_DATE) as CREATION_DATE, min(BM.event_type) as event_Type\nFROM CALYPSODBA.BO_MESSAGE BM\nWHERE BM.MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND BM.CREATION_DATE>= trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and BM.CREATION_DATE < trunc(TRUNC(SYSDATE , 'Month'), 'Month')\nand BM.EVENT_TYPE in ('DAY_VERIFIED_TRADE', 'DAY_VER_STP_TRADE') AND  BM.PRODUCT_FAMILY <> 'CreditDefaultSwap'\ngroup by BM.Trade_ID\n\n) BM_Verified_Trade\non BO_Sum.Trade_ID =  BM_Verified_Trade.Trade_ID\n\nUNION \n\nSELECT BO_MSG.Trade_id as uTrade_ID, BO_MSG.event_type as uEvent_Type, min(BO_MSG.creation_date) as uCreation_Date\nFROM CALYPSODBA.BO_MESSAGE  BO_MSG\nWHERE BO_MSG.MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND BO_MSG.CREATION_DATE>= trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and BO_MSG.CREATION_DATE <trunc(TRUNC(SYSDATE , 'Month'), 'Month')\nand BO_MSG.EVENT_TYPE not in ('ALLOCATED_TRADE', 'CH_CLEARED_RATES_TRADE', 'DAY_ASSIGNED_TRADE', 'EXERCISED_TRADE', 'PARTIAL_TERM_TRADE', 'TERMINATED_TRADE', 'VERIFIED_TRADE', \n'DAY_PEND_MWTERM_TRADE', 'DAY_CLR_RATE_STP_TRADE', 'DAY_CLEARD_RATES_TRADE', 'PEND_MWTERM_TRADE')\nAND  BO_MSG.PRODUCT_FAMILY <> 'CreditDefaultSwap'\ngroup by BO_MSG.trade_id, BO_MSG.event_type, trunc(BO_MSG.creation_date)) BO_TRD_ET\ninner join (\nSelect ecn_msg.Trade_ID,  SWOriginalCounterparty, short_name as Counterparty, trade_status as Status, \ncase  product_type \nwhen 'S ATE, Msg_Trade.TERMINATIONTRADEDATE, Msg_Trade.EXECUTIONVENUETYPE, Msg_Trade.PRODUCT_EXTENDED_TYPE, Msg_Trade.PRODUCT_ID, Msg_Trade.CURRENCY, Msg_Trade.ECN_SOURCE, Msg_Trade.ECN_BROKER_BIC, Msg_Trade.REPORTINGEXECUTIONVENUETYPE, Msg_Trade.PORTFOLIO_COMPRESSION, Msg_Trade.TRANSFERTO, Msg_Trade.TRANSFERFROM, Msg_Trade.LEI_CP, Msg_Trade.EXERCISEDUNDER, Msg_Trade.PROCESSING_ORG, \nMsg_Trade.UNDERLYING_SWAP_CH, \ntrunc(TRUNC(SYSDATE , 'Month')-1, 'Month') as Creation_Date_Start_Month, trunc(TRUNC(SYSDATE , 'Month') , 'Month')-1 as Creation_End_Month,\nsysdate as create_dte\nfrom\n(Select BM_Verified_Trade.Trade_ID as uTrade_ID,  BM_Verified_Trade.event_type as uEvent_Type, BM_Verified_Trade.CREATION_DATE as uCreation_Date\nfrom\n(Select BO_Counter.Trade_id, count( BO_Counter. event_type)\nfrom (\nSELECT BO_MSG.Trade_id, min(BO_MSG.event_type) as event_type, count(BO_MSG.event_type) as counter\nFROM CALYPSODBA.BO_MESSAGE  BO_MSG\nWHERE BO_MSG.MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND BO_MSG.CREATION_DATE>= trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and BO_MSG.CREATION_DATE < trunc(TRUNC(SYSDATE , 'Month'), 'Month')\nand BO_MSG.EVENT_TYPE in ('DAY_VERIFIED_TRADE' , 'DAY_VER_STP_TRADE') AND  BO_MSG.PRODUCT_FAMILY <> 'CreditDefaultSwap'\ngroup by BO_MSG.trade_id, event_type) BO_Counter\ngroup by BO_Counter.Trade_id\nhaving count( BO_Counter. event_type) = 1) BO_Sum\ninner join\n(\n\nSelect BM.trade_id, min(BM.CREATION_DATE) as CREATION_DATE, min(BM.event_type) as event_Type\nFROM CALYPSODBA.BO_MESSAGE BM\nWHERE BM.MESSAGE_TYPE= 'ECN_SCRITTURA_CONFIRM' AND BM.CREATION_DATE>= trunc(TRUNC(SYSDATE , 'Month')-1, 'Month') and BM.CREATION_DATE < trunc(TRUNC(SYSDATE , 'Month'), 'Month')\nand BM.EVENT_TYPE in ('DAY_VERIFIED_TRADE', 'DAY_VER_STP_TRADE') AND  BM.PRODUCT_FAMILY <> 'CreditDefaultSwap'\ngroup by BM.Trade_ID\n\n) BM_Verified_Trade\non BO_Sum.Trade_ID =  BM_Verified_Trade.Trade_ID\n\nUNION \n\nSELECT BO_MSG.Trade_id as uTrade_ID, BO_MSG.event_type as uEvent_Type, min(BO_MSG y > = iso_week_start_dte and  amend_new_day < iso_week_end_dte) then 'VALID_W' else 'INVALID_W' end as Amend_Wkly_flag\nfrom\n(\nSelect trade_id, keyword_value as amendment_date, \ncase when instr(keyword_value, '/') = 0 then\n(substr(keyword_value, 1, 2) || '-' || substr(keyword_value, 7, 4) )\n when instr(keyword_value, '/') > 0 then \n(case length(substr(keyword_value, 1, instr(keyword_value, '/')-1)) when 1 then '0' || substr(keyword_value, 1, instr(keyword_value, '/')-1) when 2 then substr(keyword_value, 1, instr(keyword_value, '/')-1) end ) || '-'|| (Case substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) when '20' then '20' ||  substr(keyword_value, instr(keyword_value, '/', 1, 2)+3, 2)  else '20' || substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) end) end as amend_Mnth_Yr, TO_CHAR(TRUNC(LAST_DAY(ADD_MONTHS(SYSDATE,-1))+1),'MM-YYYY')  as Rpt_Amend_Mnt_Yr,\ncase when instr(keyword_value, '/') = 0 then\n(substr(keyword_value, 7, 4) || '-'|| substr(keyword_value, 1, 2) || '-' || substr(keyword_value, 4, 2))\n when instr(keyword_value, '/') > 0 then \n (Case substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) when '20' then '20' ||  substr(keyword_value, instr(keyword_value, '/', 1, 2)+3, 2)  else '20' || substr(keyword_value, instr(keyword_value, '/', 1, 2)+1, 2) end) || '-'||  (case length(substr(keyword_value, 1, instr(keyword_value, '/')-1)) when 1 then '0' || substr(keyword_value, 1, instr(keyword_value, '/')-1) when 2 then substr(keyword_value, 1, instr(keyword_value, '/')-1) end ) ||'-'||\n(case length(substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1))) when 1 then '0' || substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) when 2 then substr(keyword_value, instr(keyword_value, '/')+1, (instr(keyword_value, '/', 1, 2)- instr(keyword_value, '/')-1)) end ) end as amend_Day,\nto_date(to_char(case when instr
