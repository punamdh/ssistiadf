urce":"ACTIVITY_GENERATION","messageType":"WARN","unsupported":false,"unsupportedProperty":null,"propertyPartial":false},{"message":"Pipeline parameter 'Export_to_CSV_StagingFolderPath' was created for the staging folder path of data flow 'DF_Export_to_CSV'. It has no value: fill it in with the actual staging folder path (container/folder) before running the pipeline.","messageSource":"ACTIVITY_GENERATION","messageType":"WARN","unsupported":false,"unsupportedProperty":null,"propertyPartial":false}],"jobConversionStatus":{"name":"Export_to_CSV","jobType":"DATAFLOW","conversionStatus":"PARTIAL","parameters":[],"components":[{"name":"Gigantic_CDS_query","generatedName":null,"type":"OLE DB Source","source":"COMPONENT_ADOPTION","conversionStatus":"PARTIAL","parent":"Gigantic_CDS_query","parentType":"INTERNAL","modificationStatus":"NONE","typeProperties":[{"key":"SQL_QUERY","name":"Sql_Query","value":"with secs\nas\n(\nSELECT adpnumber, ticker, SuperProductCode, ProductTypeCode, ProductID\nFROM cds..SecurityDetail\nwhere FileProductName = 'eqty' and adpnumber is not null and adpnumber != ''\n),\n\n--No leading P\nprefpass1\nas\n(\nselect *\nfrom\n(\nSELECT *, --substring(ticker, 1, len(ticker) - len(right(ticker, CHARINDEX('p', reverse(ticker))))) Ext,\n--right(ticker, CHARINDEX('p', reverse(ticker))) subber,\ncase when right(ticker,2) = '.p' then replace(ticker, '.p', ' PR')\nwhen ticker not like '%pP%' and right(ticker,2) != '.p' then\nsubstring(ticker, 1, len(ticker) - len(right(ticker, CHARINDEX('p', reverse(ticker))))) + ' ' + \ncase when right(ticker,3) = '/CL' then \nleft(upper(replace(convert(nvarchar(21) , right(ticker, CHARINDEX('p', reverse(ticker)))), '/CL', '')),1) + \n'R' +\nsubstring(upper(replace(convert(nvarchar(21) , right(ticker, CHARINDEX('p', reverse(ticker)))), '/CL', '')),2,1) + 'CL'\nwhen right(ticker,3) = '.CL' then \nleft(upper(replace(convert(nvarchar(21) , right(ticker, CHARINDEX('p', reverse(ticker)))), '.CL', '')),1) + \n'R' +\nsubstring(upper(replace(convert(nvarchar(21) , right(ticker, CHARINDEX('p', reverse(ticker)))), '.CL', '')),2,1) + 'CL'\nelse\nleft(upper(convert(nvarchar(21) , right(ticker, CHARINDEX('p', reverse(ticker))))),1) + \n'R' +\nleft(substring(upper(convert(nvarchar(21) , right(ticker, CHARINDEX('p', reverse(ticker))))),2,1),1)\nend\nwhen ticker like '%pP%' then \nLEFT(ticker, CHARINDEX('pP', ticker)-1) + ' ' + 'PR' + upper(right(ticker,1)) \nend\nFulltick\nFROM secs\nWHERE ticker LIKE '%[prw]%'\nCOLLATE Latin1_General_CS_AS\n)a\nwhere ticker not like '%Pp%'\nCOLLATE Latin1_General_CS_AS\n),\n\n--leading P\nprefpass2\nas\n(\nSELECT *, \ncase when ticker like '%.CL%' then \nsubstring(ticker, 1, len(ticker) -  CHARINDEX('p', reverse(ticker))) + ' ' + 'PR' + upper(right(replace(ticker, '.CL', ''),1)) + 'CL'\nwhen ticker like '%/CL%' then\nsubstring(ticker, 1, len(ticker) -  CHARINDEX('p', reverse(ticker))) + ' ' + 'PR' + upper(right(replace(ticker, '/CL', ''),1)) + 'CL'\nwhen ticker like '%[pP]%' then \nsubstring(ticker, 1, len(ticker) -  CHARINDEX('p', reverse(ticker))) + ' ' + 'PR' + \ncase when right(ticker,1) = 'P' then '' else upper(right(ticker,1)) end end\nFulltick\n\nFROM secs\nWHERE ticker like '%Pp%'\nCOLLATE Latin1_General_CS_AS\n),\n\nrefdata\nas\n(\nselect distinct Ticker OriginalTicker, SuperProductCode, ProductTypeCode, convert(nvarchar(40), adpnumber) securityadpnbr, convert(nvarchar(21), Fulltick) TICKERSYMBOL\nfrom \n(\nselect Ticker, SuperProductCode, ProductTypeCode, adpnumber,\n--preferred specific final run\ncase when substring(ProductTypeCode,1,3) in ('PRF', 'PFD') then\ncase when CHARINDEX(' P', Fulltick) != 0 and CHARINDEX(' PR', Fulltick) = 0 and substring(REVERSE(Fulltick),1,1) != 'P' \nand substring(REVERSE(Fulltick),1,2) != 'PP' \nthen replace(Fulltick, ' P', ' PR')\nwhen right(Fulltick,3) = ' PP'\nthen replace(Fulltick, ' PP', ' PRP')\nelse Fulltick end\n-- remove . from warrant and rights\nwhen substring(ProductTypeCode,1,3) in ('WAR', 'RIG') and LEN(Fulltick) - LEN(REPLACE(Fulltick, '.', '')) = 1 \nthen replace(Fulltick, '.', ' ')\nelse Fulltick end\nFulltick\nfrom\n(\nselect s.*, \ncase when substring(s.ProductTypeCode,1,3) in ('PRF', 'PFD') then\ncase when s.ticker like '%/%'  and right(s.ticker,2) != 'CL' and right(s.ticker,2) != 'US' then replace(s.Ticker, '/', ' PR')\nwhen s.ticker like '%/%'  and right(s.ticker,2) = 'CL' then replace(s.Ticker, '/CL', ' PR') + 'CL'\nwhen s.ticker like '%/%'  and right(s.ticker,2) = 'US' then \nreplace(replace(s.Ticker, '/', ' PR'),'.US', '')\nwhen LEN(s.ticker) - LEN(REPLACE(s.ticker, '.', '')) > 1 \nthen replace(left(s.ticker, CHARINDEX('.', s.ticker)), '.', ' ') + \nreplace(substring(s.ticker,CHARINDEX('.', s.ticker)+1, len(s.ticker) - CHARINDEX('.', s.ticker)), '.','') \nwhen LEN(s.ticker) - LEN(REPLACE(s.ticker, '.', '')) = 1 \nthen replace(s.Ticker, '.', ' PR')\nwhen LEN(s.ticker) - LEN(REPLACE(s.ticker, '-', '')) = 1 \nthen replace(s.Ticker, '-', ' ')\nelse s.Ticker \nend\nelse s.Ticker \nend\nas Fulltick\nfrom secs s\nleft outer join prefpass1 p on p.ProductID = s.ProductID\nleft outer join prefpass2 p2 on p2.ProductID = s.ProductID\nwhere p.ProductID is null and p2.ProductID is null\n\nunion \n\nselect * \nfrom prefpass1\n\nunion \n\nselect * \nfrom prefpass2\n)a\n)a\nwhere Ticker is not null\n),\n\n\nstarter_cte\nas\n(\nselect t.effectivedate, t.RFRN_ID, t.TRANS_HIST_SEQ_NBR, t.TRANS_CONTROL_ID\nfrom cds..ISP_BPSA_THS2_PS_SALE_TRANHIST t\n   left outer join\n(select t.effectivedate, max(TRANS_HIST_SEQ_NBR) TRANS_HIST_SEQ_NBR, max(right(ltrim(rtrim(TRANS_CONTROL_ID)),1)) MT, RFRN_ID\nFROM cds..ISP_BPSA_THS2_PS_SALE_TRANHIST t\n    left outer join cds..ISP_BPSA_TACCOUNT_NEWHIST n on n.client_nbr = t.client_nbr and n.branch_cd = t.branch_cd and n.account_cd = t.account_cd and n.effectivedate = t.effectivedate\n        inner join cds..securitydetail s on s.adpnumber = t.security_adp_nbr\nwhere  t.CLIENT_NBR = '0127' and t.branch_cd not in ('100', '104') and t.effectivedate >= (year(dateadd(day, -5, getdate())) * 10000) + (month(dateadd(day, -5, getdate())) * 100) + day(dateadd(day, -5, getdate())) and SuperProductCode = 'EQUITY'\nand TRANS_ACCT_HIST_CD = 'A' and (n.ACCOUNT_CLSFN_CD != '057' OR n.ACCOUNT_CLSFN_CD IS NULL) and\nt.branch_cd between '1AA' and '2XO' and\n(t.TYPE_ACCOUNT_CD = 9\nor t.TYPE_ACCOUNT_CD = 1 and (t.branch_cd not between '1AA' and '1DZ' or t.BRANCH_CD + t.ACCOUNT_CD = '1AB41023' and t.BLTTR_MRKT_CD + t.BLTTR_CPCTY_CD != '5P')\nor t.TYPE_ACCOUNT_CD = 2\nor t.TYPE_ACCOUNT_CD = 5\n)\nand t.SHARE_TRANS_QTY != 0 and t.PRC_SEC_AMT != 0 and t.BLTTR_MRKT_CD + t.BLTTR_CPCTY_CD not in ('3I', '8R', '3$')\ngroup by t.effectivedate, RFRN_ID\n) a on a.RFRN_ID = t.RFRN_ID and t.effectivedate = a.effectivedate\nleft outer join cds..ISP_BPSA_TACCOUNT_NEWHIST n on n.client_nbr = t.client_nbr and n.branch_cd = t.branch_cd and n.account_cd = t.account_cd and n.effectivedate = t.effectivedate\nwhere t.effectivedate >= (year(dateadd(day, -5, getdate())) * 10000) + (month(dateadd(day, -5, getdate())) * 100) + day(dateadd(day, -5, getdate())) and\n(a.TRANS_HIST_SEQ_NBR = t.TRANS_HIST_SEQ_NBR and a.MT = right(ltrim(rtrim(t.TRANS_CONTROL_ID)),1)\nor right(ltrim(rtrim(TRANS_CONTROL_ID)),1) in ('0', '2', '4', '6', '8') and a.RFRN_ID is not null and t.CNCL_CMMSN_TRD_CD between '1' and '9') and\nt.CLIENT_NBR = '0127' and t.branch_cd not in ('100', '104')  \nand TRANS_ACCT_HIST_CD = 'A' and (n.ACCOUNT_CLSFN_CD != '057' OR n.ACCOUNT_CLSFN_CD IS NULL) and\nt.branch_cd between '1AA' and '2XO' and\n(t.TYPE_ACCOUNT_CD = 9\nor t.TYPE_ACCOUNT_CD = 1 and (t.branch_cd not between '1AA' and '1DZ' or t.BRANCH_CD + t.ACCOUNT_CD = '1AB41023' and t.BLTTR_MRKT_CD + t.BLTTR_CPCTY_CD != '5P')\nor t.TYPE_ACCOUNT_CD = 2\nor t.TYPE_ACCOUNT_CD = 5\n)\n),\n\nsuballpop_cte\nas\n(\nselect distinct RFRN_ID\nFROM cds..ISP_BPSA_THS2_PS_SALE_TRANHIST t\n    left outer join cds..ISP_BPSA_TACCOUNT_NEWHIST n on n.client_nbr = t.client_nbr and n.branch_cd = t.branch_cd and n \nCOLLATE Latin1_General_CS_AS\n),\n\n--leading P\nprefpass2\nas\n(\nSELECT *, \ncase when ticker like '%.CL%' then \nsubstring(ticker, 1, len(ticker) -  CHARINDEX('p', reverse(ticker))) + ' ' + 'PR' + upper(right(replace(ticker, '.CL', ''),1)) + 'CL'\nwhen ticker like '%/CL%' then\nsubstring(ticker, 1, len(ticker) -  CHARINDEX('p', reverse(ticker))) + ' ' + 'PR' + upper(right(replace(ticker, '/CL', ''),1)) + 'CL'\nwhen ticker like '%[pP]%' then \nsubstring(ticker, 1, len(ticker) -  CHARINDEX('p', reverse(ticker))) + ' ' + 'PR' + \ncase when right(ticker,1) = 'P' then '' else upper(right(ticker,1)) end end\nFulltick\n\nFROM secs\nWHERE ticker like '%Pp%'\nCOLLATE Latin1_General_CS_AS\n),\n\nrefdata\nas\n(\nselect distinct Ticker OriginalTicker, SuperProductCode, ProductTypeCode, convert(nvarchar(40), adpnumber) securityadpnbr, convert(nvarchar(21), Fulltick) TICKERSYMBOL\nfrom \n(\nselect Ticker, SuperProductCode, ProductTypeCode, adpnumber,\n--preferred specific final run\ncase when substring(ProductTypeCode,1,3) in ('PRF', 'PFD') then\ncase when CHARINDEX(' P', Fulltick) != 0 and CHARINDEX(' PR', Fulltick) = 0 and substring(REVERSE(Fulltick),1,1) != 'P' \nand substring(REVERSE(Fulltick),1,2) != 'PP' \nthen replace(Fulltick, ' P', ' PR')\nwhen right(Fulltick,3) = ' PP'\nthen replace(Fulltick, ' PP', ' PRP')\nelse Fulltick end\n-- remove . from warrant and rights\nwhen substring(ProductTypeCode,1,3) in ('WAR', 'RIG') and LEN(Fulltick) - LEN(REPLACE(Fulltick, '.', '')) = 1 \nthen replace(Fulltick, '.', ' ')\nelse Fulltick end\nFulltick\nfrom\n(\nselect s.*, \ncase when substring(s.ProductTypeCode,1,3) in ('PRF', 'PFD') then\ncase when s.ticker like '%/%'  and right(s.ticker,2) != 'CL' and right(s.ticker,2) != 'US' then replace(s.Ticker, '/', ' PR')\nwhen s.ticker like '%/%'  and right(s.ticker,2) = 'CL' then replace(s.Ticker, '/CL', ' PR') + 'CL'\nwhen s.ticker like '%/%'  and right(s.ticker,2) = 'US' then \nreplace(replace(s.Ticker, '/', ' PR'),'.US', '')\nwhen LEN(s.ticker) - LEN(REPLACE(s.ticker, '.', '')) > 1 \nthen replace(left(s.ticker, CHARINDEX('.', s.ticker)), '.', ' ') + \nreplace(substring(s.ticker,CHARINDEX('.', s.ticker)+1, len(s.ticker) - CHARINDEX('.', s.ticker)), '.','') \nwhen LEN(s.ticker) - LEN(REPLACE(s.ticker, '.', '')) = 1 \nthen replace(s.Ticker, '.', ' PR')\nwhen LEN(s.ticker) - LEN(REPLACE(s.ticker, '-', '')) = 1 \nthen replace(s.Ticker, '-', ' ')\nelse s.Ticker \nend\nelse s.Ticker \nend\nas Fulltick\nfrom secs s\nleft outer join prefpass1 p on p.ProductID = s.ProductID\nleft outer join prefpass2 p2 on p2.ProductID = s.ProductID\nwhere p.ProductID is null and p2.ProductID is null\n\nunion \n\nselect * \nfrom prefpass1\n\nunion \n\nselect * \nfrom prefpass2\n)a\n)a\nwhere Ticker is not null\n),\n\n\nstarter_cte\nas\n(\nselect t.effectivedate, t.RFRN_ID, t.TRANS_HIST_SEQ_NBR, t.TRANS_CONTROL_ID\nfrom cds..ISP_BPSA_THS2_PS_SALE_TRANHIST t\n   left outer join\n(select t.effectivedate, max(TRANS_HIST_SEQ_NBR) TRANS_HIST_SEQ_NBR, max(right(ltrim(rtrim(TRANS_CONTROL_ID)),1)) MT, RFRN_ID\nFROM cds..ISP_BPSA_THS2_PS_SALE_TRANHIST t\n    left outer join cds..ISP_BPSA_TACCOUNT_NEWHIST n on n.client_nbr = t.client_nbr and n.branch_cd = t.branch_cd and n.account_cd = t.account_cd and n.effectivedate = t.effectivedate\n        inner join cds..securitydetail s on s.adpnumber = t.security_adp_nbr\nwhere  t.CLIENT_NBR = '0127' and t.branch_cd not in ('100', '104') and t.effectivedate >= (year(dateadd(day, -5, getdate())) * 10000) + (month(dateadd(day, -5, getdate())) * 100) + day(dateadd(day, -5, getdate())) and SuperProductCode = 'EQUITY'\nand TRANS_ACCT_HIST_CD = 'A' and (n.ACCOUNT_CLSFN_CD != '057' OR n.ACCOUNT_CLSFN_CD IS NULL) and\nt.branch_cd between '1AA' and '2XO' and\n(t.TYPE_ACCOUNT_CD = 9\nor t.TYPE_ACCOUNT_CD = 1 and (t.branch_cd not between '1AA' and '1DZ' or t.BRANCH_CD + t.ACCOUNT_CD = '1AB41023' and t.BLTTR_MRKT_CD + t.BLTTR_CPCTY_CD != '5P')\nor t.TYPE_ACCOUNT_CD = 2\nor t.TYPE_ACCOUNT_CD = 5\n)\nand t.SHARE_TRANS_QTY != 0 and t.PRC_SEC_AMT != 0 and t.BLTTR_MRKT_CD + t.BLTTR_CPCTY_CD not in ('3I', '8R', '3$')\ngroup by t.effectivedate, RFRN_ID\n) a on a.RFRN_ID = t.RFRN_ID and t.effectivedate = a.effectivedate\nleft outer join cds..ISP_BPSA_TACCOUNT_NEWHIST n on n.client_nbr = t.client_nbr and n.branch_cd = t.branch_cd and n.account_cd = t.account_cd and n.effectivedate = t.effectivedate\nwhere t.effectivedate >= (year(dateadd(day, -5, getdate())) * 10000) + (month(dateadd(day, -5, getdate())) * 100) + day(dateadd(day, -5, getdate())) and\n(a.TRANS_HIST_SEQ_NBR = t.TRANS_HIST_SEQ_NBR and a.MT = right(ltrim(rtrim(t.TRANS_CONTROL_ID)),1)\nor right(ltrim(rtrim(TRANS_CONTROL_ID)),1) in ('0', '2', '4', '6', '8') and a.RFRN_ID is not null and t.CNCL_CMMSN_TRD_CD between '1' and '9') and\nt.CLIENT_NBR = '0127' and t.branch_cd not in ('100', '104')  \nand TRANS_ACCT_HIST_CD = 'A' and (n.ACCOUNT_CLSFN_CD != '057' OR n.ACCOUNT_CLSFN_CD IS NULL) and\nt.branch_cd between '1AA' and '2XO' and\n(t.TYPE_ACCOUNT_CD = 9\nor t.TYPE_ACCOUNT_CD = 1 and (t.branch_cd not between '1AA' and '1DZ' or t.BRANCH_CD + t.ACCOUNT_CD = '1AB41023' and t.BLTTR_MRKT_CD + t.BLTTR_CPCTY_CD != '5P')\nor t.TYPE_ACCOUNT_CD = 2\nor t.TYPE_ACCOUNT_CD = 5\n)\n),\n\nsuballpop_cte\nas\n(\nselect distinct RFRN_ID\nFROM cds..ISP_BPSA_THS2_PS_SALE_TRANHIST t\n    left outer join cds..ISP_BPSA_TACCOUNT_NEWHIST n on n.client_nbr = t.client_nbr and n.branch_cd = t.branch_cd and n.account_cd = t.account_cd and n.effectivedate = t.effectivedate\nwhere t.effectivedate >= (year(dateadd(day, -5, getdate())) * 10000) + (month(dateadd(day, -5, getdate())) * 100) + day(dateadd(day, -5, getdate())) and\nt.CLIENT_NBR = '0127' and t.branch_cd not in ('100', '104')  and cast(t.processing_dt as date) <= cast(getdate() as date)\nand TRANS_ACCT_HIST_CD = 'A' and (n.ACCOUNT_CLSFN_CD = '057') and\nt.branch_cd between '1AA' and '2ZZ'  \n)\n\nselect * \nfrom \n(\nselect  distinct\n'' AllocationID,\n'WCHV' Firm,\n'BROADRIDGE' as AllocationSystem,\n   case when CNCL_CMMSN_TRD_CD between 'A' and 'Z' then 'ALX'\n   when right(ltrim(rtrim(t.TRANS_CONTROL_ID)),1) in ('2', '4', '6', '8') and sp.RFRN_ID is null then 'ALM'\n   when right(ltrim(rtrim(t.TRANS_CONTROL_ID)),1) = '0' then 'ALN' \n   when right(ltrim(rtrim(t.TRANS_CONTROL_ID)),1) = '2' and sp.RFRN_ID is not null then 'ALN' \n   when right(ltrim(rtrim(t.TRANS_CONTROL_ID)),1) in ('4', '6', '8') and sp.RFRN_ID is not null then 'ALM' \nend as TransType,\nt.trans_control_id + substring(t.TRADE_TMSTP_TXT,1,10) AllocationRefNum,\nright(ltrim(rtrim(t.TRANS_CONTROL_ID)),1) RecordSeqNum,\nformat(t.updt_last_tmstp, 'yyyy-MM-dd' )  AllocationDateTime,\nformat(processing_dt, 'yyyy-MM-dd') AllocationDate,\nsubstring(t.TRADE_TMSTP_TXT,1,10) TransDateTime,\nsubstring(t.TRADE_TMSTP_TXT,1,10) TransDate,\nt.RFRN_ID TradeRefNum,\nCAST(replace(coalesce(k.CROSS_REFERENCE_CD,   k1.CROSS_REFERENCE_CD), '.', ' ') AS VARCHAR(20))  Symbol,\nshare_trans_qty Quantity,\nPRC_SEC_AMT Price,\ncase when debit_credit_cd = 'D' and CNCL_CMMSN_TRD_CD not between 'A' and 'Z' then 'B' \n when debit_credit_cd = 'D' and CNCL_CMMSN_TRD_CD between 'A' and 'Z' and \n  t.DESC_ADD_PRNT_CD not in ('S ', 'SX') and t.TRAILER2_CD not in ('S ', 'SX')\n   and t.TRAILER3_CD not in ('S ', 'SX') \n   and t.TRAILER4_CD not in ('S ', 'SX')\n   and t.TRAILER5_CD not in ('S ', 'SX')\n   and t.TRAILER6_CD not in ('S ', 'SX')\n   and t.TRAILER7_CD not in ('S ', 'SX')\n   and t.TRAILER8_CD not in ('S ', 'SX')\n   and t.TRAILER9_CD not in ('S ', 'SX')\n   and t.TRAILER10_CD not in ('S ', 'SX') and t.type_account_cd != 5 then 'SL' \n when debit_credit_cd = 'C'  and  t.DESC_ADD_PRNT_CD not in ('S ', 'SX') and t.TRAILER2_CD not in ('S ', 'SX')\n   and t.TRAILER3_CD not in ('S ', 'SX') \n   and t.TRAILER4_CD not in ('S ', 'SX')\n   and t.TRAILER5_CD not in ('S ', 'SX')\n   and t.TRAILER6_CD not in ('S ', 'SX')\n   and t.TRAILER7_CD not in ('S ', 'SX')\n   and t.TRAILER8_CD not in ('S ', 'SX')\n   and t.TRAILER9_CD not in ('S ', 'SX')\n   and t.TRAILER10_CD not in ('S ', 'SX') and t.type_account_cd != 5\nand CNCL_CMMSN_TRD_CD not between 'A' and 'Z' then 'SL'\nwhen debit_credit_cd = 'C' and t.DESC_ADD_PRNT_CD not in ('S ', 'SX') and t.TRAILER2_CD not in ('S ', 'SX')\n   and t.TRAILER3_CD not in ('S ', 'SX') \n   and t.TRAILER4_CD not in ('S ', 'SX')\n   and t.TRAILER5_CD not in ('S ', 'SX')\n   and t.TRAILER6_CD not in ('S ', 'SX')\n   and t.TRAILER7_CD not in ('S ', 'SX')\n   and t.TRAILER8_CD not in ('S ', 'SX')\n   and t.TRAILER9_CD not in ('S ', 'SX')\n   and t.TRAILER10_CD not in ('S ', 'SX') and t.type_account_cd != 5 and CNCL_CMMSN_TRD_CD between 'A' and 'Z' then 'B'\nwhen debit_credit_cd = 'C' and \n (t.DESC_ADD_PRNT_CD = 'S ' or  \n t.TRAILER2_CD = 'S ' or \n  t.TRAILER3_CD = 'S ' or \n   t.TRAILER4_CD = 'S ' or \n    t.TRAILER5_CD = 'S ' or \n     t.TRAILER6_CD = 'S ' or \n      t.TRAILER7_CD = 'S ' or \n       t.TRAILER8_CD = 'S ' or \n        t.TRAILER9_CD = 'S ' or \n         t.TRAILER10_CD = 'S ' or t.type_account_cd = 5)\nand CNCL_CMMSN_TRD_CD not between 'A' and 'Z' then 'SS'\nwhen debit_credit_cd = 'D' and (t.DESC_ADD_PRNT_CD = 'S ' or  \n t.TRAILER2_CD = 'S ' or \n  t.TRAILER3_CD = 'S ' or \n   t.TRAILER4_CD = 'S ' or \n    t.TRAILER5_CD = 'S ' or \n     t.TRAILER6_CD = 'S ' or \n      t.TRAILER7_CD = 'S ' or \n       t.TRAILER8_CD = 'S ' or \n        t.TRAILER9_CD = 'S ' or \n         t.TRAILER10_CD = 'S ' or t.type_account_cd = 5) and CNCL_CMMSN_TRD_CD between 'A' and 'Z' then 'SS'\nwhen debit_credit_cd = 'C'  and (t.DESC_ADD_PRNT_CD in ('S ', 'SX') or\n  t.TRAILER2_CD in ('S ', 'SX') or\n     t.TRAILER3_CD in ('S ', 'SX') or\n       t.TRAILER4_CD in ('S ', 'SX') or\n         t.TRAILER5_CD in ('S ', 'SX') or\n           t.TRAILER6_CD in ('S ', 'SX') or\n             t.TRAILER7_CD in ('S ', 'SX') or\n               t.TRAILER8_CD in ('S ', 'SX') or\n                 t.TRAILER9_CD in ('S ', 'SX') or\n                   t.TRAILER10_CD in ('S ', 'SX') or t.type_account_cd = 5) and CNCL_CMMSN_TRD_CD between 'A' and 'Z' then 'B'\nwhen debit_credit_cd = 'C' and (t.DESC_ADD_PRNT_CD = 'SX' or  \n t.TRAILER2_CD = 'SX' or \n  t.TRAILER3_CD = 'SX' or \n   t.TRAILER4_CD = 'SX' or \n    t.TRAILER5_CD = 'SX' or \n     t.TRAILER6_CD = 'SX' or \n      t.TRAILER7_CD = 'SX' or \n       t.TRAILER8_CD = 'SX' or \n        t.TRAILER9_CD = 'SX' or \n         t.TRAILER10_CD = 'SX') and CNCL_CMMSN_TRD_CD not between 'A' and 'Z' then 'SX'\nwhen debit_credit_cd = 'D' and (t.DESC_ADD_PRNT_CD = 'SX' or  \n t.TRAILER2_CD = 'SX' or \n  t.TRAILER3_CD = 'SX' or \n   t.TRAILER4_CD = 'SX' or \n    t.TRAILER5_CD = 'SX' or \n     t.TRAILER6_CD = 'SX' or \n      t.TRAILER7_CD = 'SX' or \n       t.TRAILER8_CD = 'SX' or \n        t.TRAILER9_CD = 'SX' or \n         t.TRAILER10_CD = 'SX') and CNCL_CMMSN_TRD_CD between 'A' and 'Z' then 'SX'\nelse '' end Side,\nt.branch_Cd + t.account_cd as CustAcctNum,\n--'' as ShortName,\n--'' CATAccountID,\n--'' AllocationFDID,\n--'' CancelAllocationID,\n\ncase when CNCL_CMMSN_TRD_CD between 'A' and 'Z'\nthen substring(t.trans_control_id,1,len(t.trans_control_id)-1) + cast(cast(right(ltrim(rtrim(t.TRANS_CONTROL_ID)),1) as int) -1 as varchar(2)) + substring(t.TRADE_TMSTP_TXT,1,10)\n  when right(ltrim(rtrim(t.TRANS_CONTROL_ID)),1) != '0' and  CNCL_CMMSN_TRD_CD not between 'A' and 'Z' \n  and sp.RFRN_ID is null\n  then substring(t.trans_control_id,1,len(t.trans_control_id)-1)  + cast(cast(right(ltrim(rtrim(t.TRANS_CONTROL_ID)),1) as int) -2 as varchar(2))\n   + substring(t.TRADE_TMSTP_TXT,1,10)\n  when right(ltrim(rtrim(t.TRANS_CONTROL_ID)),1) not in ('0', '2') and  CNCL_CMMSN_TRD_CD not between 'A' and 'Z' \n  and sp.RFRN_ID is not null\n  then substring(t.trans_control_id,1,len(t.trans_control_id)-1)  +\ncast(cast(right(ltrim(rtrim(t.TRANS_CONTROL_ID)),1) as int) -2 as varchar(2))\n   + substring(t.TRADE_TMSTP_TXT,1,10)\n   else '' end CancelAllocationRefNum,\n\n--'' InstitutionFlag,\nformat(t.TRANSACTION_DT, 'yyyy-MM-dd
