"parameters":[],"components":[{"name":"OLE_DB_Source","generatedName":null,"type":"OLE DB Source","source":"COMPONENT_ADOPTION","conversionStatus":"PARTIAL","parent":"OLE_DB_Source","parentType":"INTERNAL","modificationStatus":"NONE","typeProperties":[{"key":"SQL_QUERY","name":"Sql_Query","value":"/*\nnlesptotal Last Updated: 2025-08-27\nEnterprise Space Power Report\nnlesptotal ESP_Report_Query_2025-08-27.sql\nDARE_Enterprise Space and Power Capacity Report_NLYTE_2025-08-27.rdl\n*/\nDECLARE @WattsperRU INT = 100\nSELECT \nCASE \n\tWHEN LG.[LocationGroupType]=9\n\tTHEN (SELECT [Detail] FROM [nlyte].[dbo].[LocationPurpose] WHERE [LocationPurposeId]=\n\t(SELECT [LocationPurposeId] FROM [nlyte].[dbo].[LocationGroup] WHERE [LocationGroupID]=LG.[ParentLocationGroupID]))\n\tELSE LP.[Detail]\nEND AS [SiteGroup], /*nvarchar(255), not null*/\nCASE \n\tWHEN LG.[LocationGroupType]=8\n\tTHEN LG.[Tag] \n\tELSE (SELECT [Tag] FROM [nlyte].[dbo].[LocationGroup] WHERE [LocationGroupID]=LG.[ParentLocationGroupID])\nEND AS [SiteName], /*varchar(50), not null*/\nLGA.[Room] AS [DataHall], /*varchar(50), not null*/\nA.[AssetNumber] AS [NlyteID], /*int, not null*/\nA.[AssetName], /*nvarchar(80)*/\nA.[Tag], /*nvarchar(255), null*/\nCABTYPE.[Detail] AS [CabinetUsage], /*varchar(30), not null*/\n\n--[TotalRU]\nCEILING(CABHW.[InternalMountingRailHeight] / 44.45) AS [TotalRU], /*int, not null*/\n\n--[UnavailableRU] - [MarkedRU] = [InstalledRU] was [RackSpaceUsed]\n((SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] \n\tWHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=0) - ISNULL((SELECT CEILING(SUM([Height]) / 44.45) \n\tFROM [nlyte].[dbo].[CabinetMarker] WHERE [CabinetAssetID]=A.[AssetID]),0)) \nAS [InstalledRU], /*int, not null*/\n\n--[MarkedRU] + [ClosedRU] = [StrandedRU]\nCASE \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN ((SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) + \n\tISNULL((SELECT CEILING(SUM([Height]) / 44.45) FROM [nlyte].[dbo].[CabinetMarker] WHERE [CabinetAssetID]=A.[AssetID]),0))\n\tELSE ISNULL((SELECT CEILING(SUM([Height]) / 44.45) FROM [nlyte].[dbo].[CabinetMarker] WHERE [CabinetAssetID]=A.[AssetID]),0)\nEND AS [StrandedRU], /*int, not null*/\n\n--[InstalledRU]  + [MarkedRU] + [ClosedRU] = [TotalConsumed]\nCASE \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN CEILING(CABHW.[InternalMountingRailHeight] / 44.45)\n\tELSE (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=0)\nEND AS [TotalConsumed], /*int, not null*/\n\n--[AbandonedRU]\nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) \n\tELSE 0 \nEND AS [AbandonedRU], /*int, not null*/\n\n--[FreeRU] - [AbandonedRU] - [ClosedRU]  = [AvailableRU]\nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN 0 \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN 0\n\tELSE (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)\nEND AS [AvailableRU], /*int, not null*/\n\n--[PowerThreshold] value in WATTS\nCEILING(CAB.[HeatThreshold] * 1000) AS [PowerThreshold], /*int, not null*/\n\n--[PowerUsed] value in WATTS\nISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\tWHERE IA.CabinetAssetID=A.[AssetID]),0) \nAS [PowerUsed], /*int, not null*/\n\n--[PowerFree] value in WATTS\n(CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\tINNER JOIN [nlyte].[Power].[ConsumerMa e":"Source","source":"COMPONENT_GENERATION","conversionStatus":"PARTIAL","parent":"OLE_DB_Source","parentType":"INTERNAL","modificationStatus":"NONE","typeProperties":[{"key":"SQL_QUERY","name":"Sql_Query","value":"/*\nnlesptotal Last Updated: 2025-08-27\nEnterprise Space Power Report\nnlesptotal ESP_Report_Query_2025-08-27.sql\nDARE_Enterprise Space and Power Capacity Report_NLYTE_2025-08-27.rdl\n*/\nDECLARE @WattsperRU INT = 100\nSELECT \nCASE \n\tWHEN LG.[LocationGroupType]=9\n\tTHEN (SELECT [Detail] FROM [nlyte].[dbo].[LocationPurpose] WHERE [LocationPurposeId]=\n\t(SELECT [LocationPurposeId] FROM [nlyte].[dbo].[LocationGroup] WHERE [LocationGroupID]=LG.[ParentLocationGroupID]))\n\tELSE LP.[Detail]\nEND AS [SiteGroup], /*nvarchar(255), not null*/\nCASE \n\tWHEN LG.[LocationGroupType]=8\n\tTHEN LG.[Tag] \n\tELSE (SELECT [Tag] FROM [nlyte].[dbo].[LocationGroup] WHERE [LocationGroupID]=LG.[ParentLocationGroupID])\nEND AS [SiteName], /*varchar(50), not null*/\nLGA.[Room] AS [DataHall], /*varchar(50), not null*/\nA.[AssetNumber] AS [NlyteID], /*int, not null*/\nA.[AssetName], /*nvarchar(80)*/\nA.[Tag], /*nvarchar(255), null*/\nCABTYPE.[Detail] AS [CabinetUsage], /*varchar(30), not null*/\n\n--[TotalRU]\nCEILING(CABHW.[InternalMountingRailHeight] / 44.45) AS [TotalRU], /*int, not null*/\n\n--[UnavailableRU] - [MarkedRU] = [InstalledRU] was [RackSpaceUsed]\n((SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] \n\tWHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=0) - ISNULL((SELECT CEILING(SUM([Height]) / 44.45) \n\tFROM [nlyte].[dbo].[CabinetMarker] WHERE [CabinetAssetID]=A.[AssetID]),0)) \nAS [InstalledRU], /*int, not null*/\n\n--[MarkedRU] + [ClosedRU] = [StrandedRU]\nCASE \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN ((SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) + \n\tISNULL((SELECT CEILING(SUM([Height]) / 44.45) FROM [nlyte].[dbo].[CabinetMarker] WHERE [CabinetAssetID]=A.[AssetID]),0))\n\tELSE ISNULL((SELECT CEILING(SUM([Height]) / 44.45) FROM [nlyte].[dbo].[CabinetMarker] WHERE [CabinetAssetID]=A.[AssetID]),0)\nEND AS [StrandedRU], /*int, not null*/\n\n--[InstalledRU]  + [MarkedRU] + [ClosedRU] = [TotalConsumed]\nCASE \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN CEILING(CABHW.[InternalMountingRailHeight] / 44.45)\n\tELSE (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=0)\nEND AS [TotalConsumed], /*int, not null*/\n\n--[AbandonedRU]\nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) \n\tELSE 0 \nEND AS [AbandonedRU], /*int, not null*/\n\n--[FreeRU] - [AbandonedRU] - [ClosedRU]  = [AvailableRU]\nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN 0 \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN 0\n\tELSE (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)\nEND AS [AvailableRU], /*int, not null*/\n\n--[PowerThreshold] value in WATTS\nCEILING(CAB.[HeatThreshold] * 1000) AS [PowerThreshold], /*int, not null*/\n\n--[PowerUsed] value in WATTS\nISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\tWHERE IA.CabinetAssetID=A.[AssetID]),0) \nAS [PowerUsed], /*int, not null*/\n\n--[PowerFree] value in WATTS\n(CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))\nAS [PowerFree], /*int, not null*/\n\n--[ReadyUnAssignedRU]\n--If PowerUsed<>0 then RackSpaceFree \nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN 0 \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)=0\n\tTHEN 0\n\tWHEN (CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))<=0\n\tTHEN 0\n\tELSE (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)\nEND AS [ReadyUnAssignedRU], /*int, not null*/\n\n--[SpaceNoKW]\n--If PowerUsed=0 then RackSpaceFree \nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN 0 \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)=0\n\tTHEN 0\n\tWHEN (CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))<=0\n\tTHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)\n\tELSE 0\nEND AS [SpaceNoKW], /*int, not null*/\n\n--[Ready2RUHoles]\nISNULL(FLOOR(CASE \n\tWHEN CABTYPE.[Detail]<>'Ready'\n\tTHEN 0 \n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)=0\n\tTHEN 0\n\tWHEN (CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) )) < @WattsperRU\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) < \n\t\t((CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) )) \n\t\t/ (@WattsperRU * 2)) \n\tTHEN (CAB.[MaxFreeUSpace] / 2)\n\tELSE ((CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) )) \n\t\t/ (@WattsperRU * 2))\nEND),0) AS [Ready2RUHoles] /*int, not null*/\n\nFROM [nlyte].[dbo].[Asset] AS A\nJOIN [nlyte].[dbo].[Cabinet] AS CAB ON A.[AssetID]=CAB.[AssetID]\nJOIN [nlyte].[dbo].[CabinetUsage] AS CABTYPE ON CAB.[CabinetUsageID]=CABTYPE.[CabinetUsageID]\nJOIN [nlyte].[dbo].[Material] AS HW ON A.[MaterialID]=HW.[MaterialID]\nJOIN [nlyte].[dbo].[CabinetMaterial] AS CABHW ON A.[MaterialID]=CABHW.[MaterialID]\nJOIN [nlyte].[dbo].[LocationGroup] AS LG ON A.[LocationGroupID]=LG.[LocationGroupID]\nJOIN [nlyte].[dbo].[vwLocationGroupAncestralInfo] AS LGA ON LG.[LocationGroupID]=LGA.[LocationGroupID]\nLEFT JOIN [nlyte].[dbo].[LocationPurpose] aS LP ON LP.[LocationPurposeId]=LG.[LocationPurposeId]\n\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [DCMFlavor] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='DCMFlavor') AS DCMFlavor ON A.[AssetID]=DCMFlavor.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [ServiceCat] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='ServiceCat') AS ServiceCat ON A.[AssetID]=ServiceCat.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [VerifiedRA] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='VerifiedRA') AS VerifiedRA ON A.[AssetID]=VerifiedRA.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [PlanningNotes] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='PlanningNotes') AS PlanningNotes ON A.[AssetID]=PlanningNotes.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [Status] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='Status') AS RKStatus ON A.[AssetID]=RKStatus.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueCheckBox] AS [CWExclude] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='CWExclude') AS CWExclude ON A.[AssetID]=CWExclude.[AssetID]\n\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [CabinetProfile] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='CabinetProfile') AS CabinetProfile ON A.[AssetID]=CabinetProfile.[AssetID]\n\nWHERE (A.[RecordStatus]=2 OR A.[AssetOperationalStatusID] IN (1,2,3)) /*[RecordStatus]='Active' OR [AssetOperationalStatusID] IN ('Pre-Procurement','Procurement','Operational')*/\nAND A.[AssetID] NOT IN (SELECT [AssetID] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='CWExclude')\nORDER BY [SiteGroup], [SiteName], [DataHall], [AssetName]\n/*\nnlesptotal Last Updated: 2025-08-27\nEnterprise Space Power Report\nnlesptotal ESP_Report_Query_2025-08-27.sql\nDARE_Enterprise Space and Power Capacity Re o].[CabinetMarker] WHERE [CabinetAssetID]=A.[AssetID]),0)) \nAS [InstalledRU], /*int, not null*/\n\n--[MarkedRU] + [ClosedRU] = [StrandedRU]\nCASE \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN ((SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) + \n\tISNULL((SELECT CEILING(SUM([Height]) / 44.45) FROM [nlyte].[dbo].[CabinetMarker] WHERE [CabinetAssetID]=A.[AssetID]),0))\n\tELSE ISNULL((SELECT CEILING(SUM([Height]) / 44.45) FROM [nlyte].[dbo].[CabinetMarker] WHERE [CabinetAssetID]=A.[AssetID]),0)\nEND AS [StrandedRU], /*int, not null*/\n\n--[InstalledRU]  + [MarkedRU] + [ClosedRU] = [TotalConsumed]\nCASE \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN CEILING(CABHW.[InternalMountingRailHeight] / 44.45)\n\tELSE (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=0)\nEND AS [TotalConsumed], /*int, not null*/\n\n--[AbandonedRU]\nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) \n\tELSE 0 \nEND AS [AbandonedRU], /*int, not null*/\n\n--[FreeRU] - [AbandonedRU] - [ClosedRU]  = [AvailableRU]\nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN 0 \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN 0\n\tELSE (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)\nEND AS [AvailableRU], /*int, not null*/\n\n--[PowerThreshold] value in WATTS\nCEILING(CAB.[HeatThreshold] * 1000) AS [PowerThreshold], /*int, not null*/\n\n--[PowerUsed] value in WATTS\nISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\tWHERE IA.CabinetAssetID=A.[AssetID]),0) \nAS [PowerUsed], /*int, not null*/\n\n--[PowerFree] value in WATTS\n(CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))\nAS [PowerFree], /*int, not null*/\n\n--[ReadyUnAssignedRU]\n--If PowerUsed<>0 then RackSpaceFree \nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN 0 \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)=0\n\tTHEN 0\n\tWHEN (CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))<=0\n\tTHEN 0\n\tELSE (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)\nEND AS [ReadyUnAssignedRU], /*int, not null*/\n\n--[SpaceNoKW]\n--If PowerUsed=0 then RackSpaceFree \nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN 0 \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)=0\n\tTHEN 0\n\tWHEN (CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))<=0\n\tTHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)\n\tELSE 0\nEND AS [SpaceNoKW], /*int, not null*/\n\n--[Ready2RUHoles]\nISNULL(FLOOR(CASE \n\tWHEN CABTYPE.[Detail]<>'Ready'\n\tTHEN 0 \n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)=0\n\tTHEN 0\n\tWHEN (CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) )) < @WattsperRU\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) < \n\t\t((CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) )) \n\t\t/ (@WattsperRU * 2)) \n\tTHEN (CAB.[MaxFreeUSpace] / 2)\n\tELSE ((CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) )) \n\t\t/ (@WattsperRU * 2))\nEND),0) AS [Ready2RUHoles] /*int, not null*/\n\nFROM [nlyte].[dbo].[Asset] AS A\nJOIN [nlyte].[dbo].[Cabinet] AS CAB ON A.[AssetID]=CAB.[AssetID]\nJOIN [nlyte].[dbo].[CabinetUsage] AS CABTYPE ON CAB.[CabinetUsageID]=CABTYPE.[CabinetUsageID]\nJOIN [nlyte].[dbo].[Material] AS HW ON A.[MaterialID]=HW.[MaterialID]\nJOIN [nlyte].[dbo].[CabinetMaterial] AS CABHW ON A.[MaterialID]=CABHW.[MaterialID]\nJOIN [nlyte].[dbo].[LocationGroup] AS LG ON A.[LocationGroupID]=LG.[LocationGroupID]\nJOIN [nlyte].[dbo].[vwLocationGroupAncestralInfo] AS LGA ON LG.[LocationGroupID]=LGA.[LocationGroupID]\nLEFT JOIN [nlyte].[dbo].[LocationPurpose] aS LP ON LP.[LocationPurposeId]=LG.[LocationPurposeId]\n\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [DCMFlavor] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='DCMFlavor') AS DCMFlavor ON A.[AssetID]=DCMFlavor.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [ServiceCat] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='ServiceCat') AS ServiceCat ON A.[AssetID]=ServiceCat.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [VerifiedRA] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='VerifiedRA') AS VerifiedRA ON A.[AssetID]=VerifiedRA.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [PlanningNotes] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='PlanningNotes') AS PlanningNotes ON A.[AssetID]=PlanningNotes.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [Status] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='Status') AS RKStatus ON A.[AssetID]=RKStatus.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueCheckBox] AS [CWExclude] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='CWExclude') AS CWExclude ON A.[AssetID]=CWExclude.[AssetID]\n\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [CabinetProfile] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='CabinetProfile') AS CabinetProfile ON A.[AssetID]=CabinetProfile.[AssetID]\n\nWHERE (A.[RecordStatus]=2 OR A.[AssetOperationalStatusID] IN (1,2,3)) /*[RecordStatus]='Active' OR [AssetOperationalStatusID] IN ('Pre-Procurement','Procurement','Operational')*/\nAND A.[AssetID] NOT IN (SELECT [AssetID] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='CWExclude')\nORDER BY [SiteGroup], [SiteName], [DataHall], [AssetName]\n/*\nnlesptotal Last Updated: 2025-08-27\nEnterprise Space Power Report\nnlesptotal ESP_Report_Query_2025-08-27.sql\nDARE_Enterprise Space and Power Capacity Report_NLYTE_2025-08-27.rdl\n\tCHANGE NOTES:\n\t\tUpdated logic for [SiteName] in preparation for the data center renames.\n\t\tChanged A.[AssetID] to A.[AssetNumber] for [NlyteID] to remove the disconnect with the value sent to ServiceNow.\n*/","conversionStatus":"SUCCESS"},{"key":"PRE_SQL","name":"Pre_Sql","value":null,"conversionStatus":"SUCCESS"},{"key":"POST_SQL","name":"Post_Sql","value":null,"conversionStatus":"SUCCESS"},{"key":"TABLE_NAME","name":"OpenRowset","value":null,"conversionStatus":"SUCCESS"},{"key":"DATABASE","name":"Database","value":"DBGENERIC","conversionStatus":"SUCCESS"}],"messages":[{"message":"Component name 'OLE DB Source' contained characters not supported by Azure Data Factory and was sanitized to 'OLE_DB_Source'.","messageSource":"RULE_ADOPTION","messageType":"WARN","unsupported":false,"unsupportedProperty":null,"propertyPartial":false},{"message":"Sanitized component/field names and expressions of 'OLEDBSource' to conform to Azure Data Factory naming rules.","messageSource":"RULE","messageType":"WARN","unsupported":false,"unsupportedProperty":null,"propertyPartial":false},{"message":"The data is read through parquet and replication is in place: the SqlServer connection is not supported in ADF data flows, so the data flow reads the replicated parquet file and the SqlCommand is not applied to it. Apply the query where the data is replicated and review.","messageSource":"GENERATION","messageType":"WARN","unsupported":false,"unsupportedProperty":"SqlCommand","propertyPartial":false},{"message":"Source Component named O e]=8\n\tTHEN LG.[Tag] \n\tELSE (SELECT [Tag] FROM [nlyte].[dbo].[LocationGroup] WHERE [LocationGroupID]=LG.[ParentLocationGroupID])\nEND AS [SiteName], /*varchar(50), not null*/\nLGA.[Room] AS [DataHall], /*varchar(50), not null*/\nLG.[DuplicateLocationGroupName], /*varchar(760), null*/\nA.[AssetNumber] AS [NlyteID], /*int, not null*/\nA.[AssetName], /*nvarchar(80)*/\nA.[Tag], /*nvarchar(255), null*/\nCABTYPE.[Detail] AS [CabinetUsage], /*varchar(30), not null*/\n\n--[TotalRU]\nCEILING(CABHW.[InternalMountingRailHeight] / 44.45) AS [TotalRU], /*int, not null*/\n\n--[UnavailableRU] - [MarkedRU] = [InstalledRU] was [RackSpaceUsed]\n((SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] \n\tWHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=0) - ISNULL((SELECT CEILING(SUM([Height]) / 44.45) \n\tFROM [nlyte].[dbo].[CabinetMarker] WHERE [CabinetAssetID]=A.[AssetID]),0)) \nAS [InstalledRU], /*int, not null*/\n\n--[MarkedRU] + [ClosedRU] = [StrandedRU]\nCASE \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN ((SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) + \n\tISNULL((SELECT CEILING(SUM([Height]) / 44.45) FROM [nlyte].[dbo].[CabinetMarker] WHERE [CabinetAssetID]=A.[AssetID]),0))\n\tELSE ISNULL((SELECT CEILING(SUM([Height]) / 44.45) FROM [nlyte].[dbo].[CabinetMarker] WHERE [CabinetAssetID]=A.[AssetID]),0)\nEND AS [StrandedRU], /*int, not null*/\n\n--[InstalledRU]  + [MarkedRU] + [ClosedRU] = [TotalConsumed]\nCASE \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN CEILING(CABHW.[InternalMountingRailHeight] / 44.45)\n\tELSE (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=0)\nEND AS [TotalConsumed], /*int, not null*/\n\n--[FreeRU] - [AbandonedRU] - [ClosedRU]  = [AvailableRU]\nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN 0 \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN 0\n\tELSE (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)\nEND AS [AvailableRU], /*int, not null*/\n\n--[PowerThreshold] value in WATTS\nCEILING(CAB.[HeatThreshold] * 1000) AS [PowerThreshold], /*int, not null*/\n\n--[PowerUsed] value in WATTS\nISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\tWHERE IA.CabinetAssetID=A.[AssetID]),0) \nAS [PowerUsed], /*int, not null*/\n\n--[PowerFree] value in WATTS\n(CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))\nAS [PowerFree], /*int, not null*/\n\n--*****Needed for ESP Report*****\n\n--[AbandonedRU]\nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) \n\tELSE 0 \nEND AS [AbandonedRU], /*int, not null*/\n\n--[ReadyUnAssignedRU]\n--If PowerUsed<>0 then RackSpaceFree \nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN 0 \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)=0\n\tTHEN 0\n\tWHEN (CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))<=0\n\tTHEN 0\n\tELSE (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)\nEND AS [ReadyUnAssignedRU], /*int, not null*/\n\n--[SpaceNoKW]\n--If PowerUsed=0 then RackSpaceFree \nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN 0 \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)=0\n\tTHEN 0\n\tWHEN (CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))<=0\n\tTHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)\n\tELSE 0\nEND AS [SpaceNoKW], /*int, not null*/\n\n--[Ready2RUHoles]\nISNULL(FLOOR(CASE \n\tWHEN CABTYPE.[Detail]<>'Ready'\n\tTHEN 0 \n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)=0\n\tTHEN 0\n\tWHEN (CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) )) < @WattsperRU\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) < \n\t\t((CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) )) \n\t\t/ (@WattsperRU * 2)) \n\tTHEN (CAB.[MaxFreeUSpace] / 2)\n\tELSE ((CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) )) \n\t\t/ (@WattsperRU * 2))\nEND),0) AS [Ready2RUHoles], /*int, not null*/\n\n--*****Needed for SCM Report*****\n\n--[PoweredServerCounts]\n(SELECT COUNT(IA.[AssetID]) \n\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\tINNER JOIN [nlyte].[dbo].[Material] AS IHW ON IA.[MaterialID]=IHW.[MaterialID]\n\t\tINNER JOIN [nlyte].[dbo].[MaterialType] AS IMT ON IMT.[MaterialTypeID]=IHW.[MaterialTypeID]\n\t\tWHERE IA.CabinetAssetID=A.[AssetID] \n\t\tAND ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption])>0\n\t\tAND IMT.[Detail]='Server') \nAS [PoweredServerCounts], /*int, not null*/\n\n--[PoweredDeviceCounts]\n(SELECT COUNT(IA.[AssetID]) \n\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\tINNER JOIN [nlyte].[dbo].[Material] AS IHW ON IA.[MaterialID]=IHW.[MaterialID]\n\t\tINNER JOIN [nlyte].[dbo].[MaterialType] AS IMT ON IMT.[MaterialTypeID]=IHW.[MaterialTypeID]\n\t\tWHERE IA.CabinetAssetID=A.[AssetID] \n\t\tAND ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption])>0\n\t\tAND IMT.[Detail]<>'Server') \nAS [PoweredDeviceCounts], /*int, not null*/\n\n--[Powered2RUBlock]\nISNULL(FLOOR(CASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN 0 \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)=0\n\tTHEN 0\n\tWHEN (CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) )) < @WattsperRU\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) < \n\t\t((CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))\n\t\t/ (@WattsperRU * 2)) \n\tTHEN (CAB.[MaxFreeUSpace] / 2)\n\tELSE ((CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))\n\t\t/ (@WattsperRU * 2))\nEND),0) AS [Powered2RUBlock], /*int, not null*/\n\n--[Powered3RUBlock]\nISNULL(FLOOR(CASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN 0 \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)=0\n\tTHEN 0\n\tWHEN (CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) )) < @WattsperRU\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) < \n\t\t((CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))\n\t\t/ (@WattsperRU * 3)) \n\tTHEN (CAB.[MaxFreeUSpace] / 3)\n\tELSE ((CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))\n\t\t/ (@WattsperRU * 3))\nEND),0) AS [Powered3RUBlock], /*int, not null*/\n\nISNULL(DCMFlavor.[DCMFlavor], 'Unclassified') AS [DCMFlavor2], /*nvarchar(1000), null*/\n\n--*****Unused Space Metrics*****\n\n--[UnavailableRU]\n(SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=0) AS [UnavailableRU], /*int, not null*/\n\n--[MarkedRU] Was [BlockedRU]\nISNULL((SELECT CEILING(SUM([Height]) / 44.45) FROM [nlyte].[dbo].[CabinetMarker] WHERE [CabinetAssetID]=A.[AssetID]),0) AS [MarkedRU], /*int, not null*/\n\n--[ClosedRU]\n(CASE \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) \n\tELSE 0 \nEND) AS [ClosedRU], /*int, not null*/\n\n--[FreeRU] was [RackSpaceFree]\n(SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)  AS  [FreeRU], /*int, not null*/\n\nCAB.[MaxFreeUSpace] AS [RUMAX], /*int, null*/\n\n--*****NLTE Record Status***** \nRS.[Description] AS [RecordStatus], /*varchar(20), not null*/\nOS.[Detail] AS [OperationalStatus], /*varchar(30), not null*/\n\n--*****Unused Custom Properties*****\nISNULL(ServiceCat.[ServiceCat], 'Unclassified') AS [ServiceCat2], /*nvarchar(1000), null*/\nCWExclude.[CWExclude], /*bit, null*/\nRKStatus.[Status], /*nvarchar(1000), null*/\nVerifiedRA.[VerifiedRA], /*nvarchar(1000), null*/\nPlanningNotes.[PlanningNotes], /*nvarchar(1000), null*/\n\n--*****Fields mapped to NTZM names for data validation***** \nA.[DamagedRFIDTag] AS [EntID], /*nvarchar(255), null*/\nA.[Tag] AS [WFGrid], /*nvarchar(255), null*/\nCABTYPE.[Detail] AS [Lifecycle2], /*varchar(30), not null*/\n\n--*****New Fields for data validation reporting*****\nA.[SerialNumber], /*nvarchar(50), null*/\nA.[RFIDTag], /*nvarchar(255), null*/\nCAB.[HeatingLimit], /*float, not null*/\nCAB.[HeatThreshold], /*float, not null*/\nCAB.[CanBeAllocatedTo], /*bit, not null*/\n\n--*****New Fields for X/Y cords*****\nAV.[GridReferenceLayer] AS [Layer],\nAV.[GridReferenceRow] AS [Row],\nAV.[GridReferenceColumn] AS [Column],\nFP.[Rotation],\nFP.[X] AS [X_mm],\nFP.[Y] AS [Y_mm],\n(FP.[X] / 25.4) AS [X_in],\n(FP.[Y] / 25.4) AS [Y_in],\n\n--*****New Custom Field for CabinetProfile*****\nISNULL(CabinetProfile.[CabinetProfile], 'Unclassified') AS [CabinetProfile],\n\n--*****New Field for Neighborhood*****\nCASE \n\tWHEN BGM.[OwnershipPercentage]=100 AND BG.[ParentBusinessGroupID]=(SELECT [BusinessGroupID] FROM [nlyte].[dbo].[BusinessGroup] WHERE [BusinessGroupName]='Neighborhoods')\n\tTHEN BG.[BusinessGroupName]\n\tELSE 'Unclassified'\nEND AS [Neighborhood],\n\n--*****New Custom Field for IFDNumber*****\nIFDNumber.[IFDNumber]\n\nFROM [nlyte].[dbo].[Asset] AS A\nJOIN [nlyte].[dbo].[RecordStatus] AS RS ON RS.[RecordStatusID]=A.[RecordStatus]\nJOIN [nlyte].[dbo].[OperationalStatus] AS OS ON OS.[OperationalStatusID]=A.[AssetOperationalStatusID]\nJOIN [nlyte].[dbo].[Cabinet] AS CAB ON A.[AssetID]=CAB.[AssetID]\nJOIN [nlyte].[dbo].[CabinetUsage] AS CABTYPE ON CAB.[CabinetUsageID]=CABTYPE.[CabinetUsageID]\nJOIN [nlyte].[dbo].[Material] AS HW ON A.[MaterialID]=HW.[MaterialID]\nJOIN [nlyte].[dbo].[CabinetMaterial] AS CABHW ON A.[MaterialID]=CABHW.[MaterialID]\nJOIN [nlyte].[dbo].[LocationGroup] AS LG ON A.[LocationGroupID]=LG.[LocationGroupID]\nJOIN [nlyte].[dbo].[vwLocationGroupAncestralInfo] AS LGA ON LG.[LocationGroupID]=LGA.[LocationGroupID]\nLEFT JOIN [nlyte].[dbo].[LocationPurpose] aS LP ON LP.[LocationPurposeId]=LG.[LocationPurposeId]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [DCMFlavor] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='DCMFlavor') AS DCMFlavor ON A.[AssetID]=DCMFlavor.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [ServiceCat] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='ServiceCat') AS ServiceCat ON A.[AssetID]=ServiceCat.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [VerifiedRA] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='VerifiedRA') AS VerifiedRA ON A.[AssetID]=VerifiedRA.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [PlanningNotes] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='PlanningNotes') AS PlanningNotes ON A.[AssetID]=PlanningNotes.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [Status] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='Status') AS RKStatus ON A.[AssetID]=RKStatus.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueCheckBox] AS [CWExclude] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='CWExclude') AS CWExclude ON A.[AssetID]=CWExclude.[AssetID]\nLEFT JOIN[nlyte].[dbo].[vwAsset] AS AV ON AV.[AssetID]=A.[AssetID]\nLEFT JOIN [nlyte].[FloorPlanner].[vwRoomItem] AS FP ON FP.[AssetID]=AV.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [CabinetProfile] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='CabinetProfile') AS CabinetProfile ON A.[AssetID]=CabinetProfile.[AssetID]\nLEFT JOIN [nlyte].[dbo].[BusinessGroupAssetMap] AS BGM ON BGM.[AssetID]=A.[AssetID]\nLEFT JOIN [nlyte].[dbo].[BusinessGroup] AS BG ON BG.[BusinessGroupID]=BGM.[BusinessGroupID] \nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [IFDNumber] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='IFDNumber') AS IFDNumber ON A.[AssetID]=IFDNumber.[AssetID]\nWHERE (A.[RecordStatus]=2 OR A.[AssetOperationalStatusID] IN (1,2,3)) /*[RecordStatus]='Active' OR [AssetOperationalStatusID] IN ('Pre-Procurement','Procurement','Operational')*/\nORDER BY [SiteGroup], [SiteName], [DataHall], [AssetName]\n/*\nnlecwtotal Last Updated: 2026-06-10\nEnterprise Capacity Workbook Report\nnlecwtotal CW_Report_Query_2026-06-10.sql\nDARE_Enterprise CW Analysis Rack Capacity Details Report_NLYTE_ENV.rdl\n\tCHANGE NOTES:\n\t\tAdded [IFDNumber]\n*/","conversionStatus":"PARTIAL"},{"key":"PRE_SQL","name":"Pre_Sql","value":null,"conversionStatus":"PARTIAL"},{"key":"POST_SQL","name":"Post_Sql","value":null,"conversionStatus":"PARTIAL"},{"key":"TABLE_NAME","name":"Table_Name","value":null,"conversionStatus":"PARTIAL"},{"key":"DATABASE","name":"Database","value":"DBGENERIC","conversionStatus":"PARTIAL"},{"key":"SQL_QUERY","name":"SqlCommand","value":"/* New Query\nnlecwtotal Last Updated: 2026-06-10\nEnterprise Capacity Workbook Report\nnlecwtotal CW_Report_Query_2026-06-10.sql\nDARE_Enterprise CW Analysis Rack Capacity Details Report_NLYTE_ENV.rdl\n*/\nDECLARE @WattsperRU INT = 100\nSELECT \nCASE \n\tWHEN LG.[LocationGroupType]=9\n\tTHEN (SELECT [Detail] FROM [nlyte].[dbo].[LocationPurpose] WHERE [LocationPurposeId]=\n\t(SELECT [LocationPurposeId] FROM [nlyte].[dbo].[LocationGroup] WHERE [LocationGroupID]=LG.[ParentLocationGroupID]))\n\tELSE LP.[Detail]\nEND AS [SiteGroup], /*nvarchar(255), not null*/\nCASE \n\tWHEN LG.[LocationGroupType]=8\n\tTHEN LG.[Tag] \n\tELSE (SELECT [Tag] FROM [nlyte].[dbo].[LocationGroup] WHERE [LocationGroupID]=LG.[ParentLocationGroupID])\nEND AS [SiteName], /*varchar(50), not null*/\nLGA.[Room] AS [DataHall], /*varchar(50), not null*/\nLG.[DuplicateLocationGroupName], /*varchar(760), null*/\nA.[AssetNumber] AS [NlyteID], /*int, not null*/\nA.[AssetName], /*nvarchar(80)*/\nA.[Tag], /*nvarchar(255), null*/\nCABTYPE.[Detail] AS [CabinetUsage], /*varchar(30), not null*/\n\n--[TotalRU]\nCEILING(CABHW.[InternalMountingRailHeight] / 44.45) AS [TotalRU], /*int, not null*/\n\n--[UnavailableRU] - [MarkedRU] = [InstalledRU] was [RackSpaceUsed]\n((SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] \n\tWHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=0) - ISNULL((SELECT CEILING(SUM([Height]) / 44.45) \n\tFROM [nlyte].[dbo].[CabinetMarker] WHERE [CabinetAssetID]=A.[AssetID]),0)) \nAS [InstalledRU], /*int, not null*/\n\n--[MarkedRU] + [ClosedRU] = [StrandedRU]\nCASE \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN ((SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) + \n\tISNULL((SELECT CEILING(SUM([Height]) / 44.45) FROM [nlyte].[dbo].[CabinetMarker] WHERE [CabinetAssetID]=A.[AssetID]),0))\n\tELSE ISNULL((SELECT CEILING(SUM([Height]) / 44.45) FROM [nlyte].[dbo].[CabinetMarker] WHERE [CabinetAssetID]=A.[AssetID]),0)\nEND AS [StrandedRU], /*int, not null*/\n\n--[InstalledRU]  + [MarkedRU] + [ClosedRU] = [TotalConsumed]\nCASE \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN CEILING(CABHW.[InternalMountingRailHeight] / 44.45)\n\tELSE (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=0)\nEND AS [TotalConsumed], /*int, not null*/\n\n--[FreeRU] - [AbandonedRU] - [ClosedRU]  = [AvailableRU]\nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN 0 \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN 0\n\tELSE (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)\nEND AS [AvailableRU], /*int, not null*/\n\n--[PowerThreshold] value in WATTS\nCEILING(CAB.[HeatThreshold] * 1000) AS [PowerThreshold], /*int, not null*/\n\n--[PowerUsed] value in WATTS\nISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\tWHERE IA.CabinetAssetID=A.[AssetID]),0) \nAS [PowerUsed], /*int, not null*/\n\n--[PowerFree] value in WATTS\n(CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))\nAS [PowerFree], /*int, not null*/\n\n--*****Needed for ESP Report*****\n\n--[AbandonedRU]\nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) \n\tELSE 0 \nEND AS [AbandonedRU], /*int, not null*/\n\n--[ReadyUnAssignedRU]\n--If PowerUsed<>0 then RackSpaceFree \nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN 0 \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)=0\n\tTHEN 0\n\tWHEN (CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))<=0\n\tTHEN 0\n\tELSE (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)\nEND AS [ReadyUnAssignedRU], /*int, not null*/\n\n--[SpaceNoKW]\n--If PowerUsed=0 then RackSpaceFree \nCASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN 0 \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)=0\n\tTHEN 0\n\tWHEN (CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))<=0\n\tTHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)\n\tELSE 0\nEND AS [SpaceNoKW], /*int, not null*/\n\n--[Ready2RUHoles]\nISNULL(FLOOR(CASE \n\tWHEN CABTYPE.[Detail]<>'Ready'\n\tTHEN 0 \n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)=0\n\tTHEN 0\n\tWHEN (CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) )) < @WattsperRU\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) < \n\t\t((CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) )) \n\t\t/ (@WattsperRU * 2)) \n\tTHEN (CAB.[MaxFreeUSpace] / 2)\n\tELSE ((CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) )) \n\t\t/ (@WattsperRU * 2))\nEND),0) AS [Ready2RUHoles], /*int, not null*/\n\n--*****Needed for SCM Report*****\n\n--[PoweredServerCounts]\n(SELECT COUNT(IA.[AssetID]) \n\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\tINNER JOIN [nlyte].[dbo].[Material] AS IHW ON IA.[MaterialID]=IHW.[MaterialID]\n\t\tINNER JOIN [nlyte].[dbo].[MaterialType] AS IMT ON IMT.[MaterialTypeID]=IHW.[MaterialTypeID]\n\t\tWHERE IA.CabinetAssetID=A.[AssetID] \n\t\tAND ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption])>0\n\t\tAND IMT.[Detail]='Server') \nAS [PoweredServerCounts], /*int, not null*/\n\n--[PoweredDeviceCounts]\n(SELECT COUNT(IA.[AssetID]) \n\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\tINNER JOIN [nlyte].[dbo].[Material] AS IHW ON IA.[MaterialID]=IHW.[MaterialID]\n\t\tINNER JOIN [nlyte].[dbo].[MaterialType] AS IMT ON IMT.[MaterialTypeID]=IHW.[MaterialTypeID]\n\t\tWHERE IA.CabinetAssetID=A.[AssetID] \n\t\tAND ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption])>0\n\t\tAND IMT.[Detail]<>'Server') \nAS [PoweredDeviceCounts], /*int, not null*/\n\n--[Powered2RUBlock]\nISNULL(FLOOR(CASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN 0 \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)=0\n\tTHEN 0\n\tWHEN (CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) )) < @WattsperRU\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) < \n\t\t((CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))\n\t\t/ (@WattsperRU * 2)) \n\tTHEN (CAB.[MaxFreeUSpace] / 2)\n\tELSE ((CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))\n\t\t/ (@WattsperRU * 2))\nEND),0) AS [Powered2RUBlock], /*int, not null*/\n\n--[Powered3RUBlock]\nISNULL(FLOOR(CASE \n\tWHEN RKStatus.[Status]='ABANDONED'\n\tTHEN 0 \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)=0\n\tTHEN 0\n\tWHEN (CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) )) < @WattsperRU\n\tTHEN 0\n\tWHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) < \n\t\t((CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))\n\t\t/ (@WattsperRU * 3)) \n\tTHEN (CAB.[MaxFreeUSpace] / 3)\n\tELSE ((CEILING(CAB.[HeatThreshold] * 1000) - (ISNULL((SELECT CEILING(SUM(ISNULL(CM.[MpafOverride], CM.[PublishedPowerConsumption]))*1000) \n\t\t\tFROM [nlyte].[dbo].[Cabinet] AS IC\n\t\t\tINNER JOIN [nlyte].[dbo].[Asset] AS IA ON IA.CabinetAssetID=IC.AssetID\n\t\t\tINNER JOIN [nlyte].[Power].[ConsumerMaterial] AS CM ON CM.MaterialID = IA.MaterialID\n\t\t\tWHERE IA.CabinetAssetID=A.[AssetID]),0) ))\n\t\t/ (@WattsperRU * 3))\nEND),0) AS [Powered3RUBlock], /*int, not null*/\n\nISNULL(DCMFlavor.[DCMFlavor], 'Unclassified') AS [DCMFlavor2], /*nvarchar(1000), null*/\n\n--*****Unused Space Metrics*****\n\n--[UnavailableRU]\n(SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=0) AS [UnavailableRU], /*int, not null*/\n\n--[MarkedRU] Was [BlockedRU]\nISNULL((SELECT CEILING(SUM([Height]) / 44.45) FROM [nlyte].[dbo].[CabinetMarker] WHERE [CabinetAssetID]=A.[AssetID]),0) AS [MarkedRU], /*int, not null*/\n\n--[ClosedRU]\n(CASE \n\tWHEN RKStatus.[Status]='CLOSED'\n\tTHEN (SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1) \n\tELSE 0 \nEND) AS [ClosedRU], /*int, not null*/\n\n--[FreeRU] was [RackSpaceFree]\n(SELECT COUNT([CabinetUID]) FROM [nlyte].[dbo].[CabinetU] WHERE [CabinetAssetID]=A.[AssetID] AND [CabinetUStateID]=1)  AS  [FreeRU], /*int, not null*/\n\nCAB.[MaxFreeUSpace] AS [RUMAX], /*int, null*/\n\n--*****NLTE Record Status***** \nRS.[Description] AS [RecordStatus], /*varchar(20), not null*/\nOS.[Detail] AS [OperationalStatus], /*varchar(30), not null*/\n\n--*****Unused Custom Properties*****\nISNULL(ServiceCat.[ServiceCat], 'Unclassified') AS [ServiceCat2], /*nvarchar(1000), null*/\nCWExclude.[CWExclude], /*bit, null*/\nRKStatus.[Status], /*nvarchar(1000), null*/\nVerifiedRA.[VerifiedRA], /*nvarchar(1000), null*/\nPlanningNotes.[PlanningNotes], /*nvarchar(1000), null*/\n\n--*****Fields mapped to NTZM names for data validation***** \nA.[DamagedRFIDTag] AS [EntID], /*nvarchar(255), null*/\nA.[Tag] AS [WFGrid], /*nvarchar(255), null*/\nCABTYPE.[Detail] AS [Lifecycle2], /*varchar(30), not null*/\n\n--*****New Fields for data validation reporting*****\nA.[SerialNumber], /*nvarchar(50), null*/\nA.[RFIDTag], /*nvarchar(255), null*/\nCAB.[HeatingLimit], /*float, not null*/\nCAB.[HeatThreshold], /*float, not null*/\nCAB.[CanBeAllocatedTo], /*bit, not null*/\n\n--*****New Fields for X/Y cords*****\nAV.[GridReferenceLayer] AS [Layer],\nAV.[GridReferenceRow] AS [Row],\nAV.[GridReferenceColumn] AS [Column],\nFP.[Rotation],\nFP.[X] AS [X_mm],\nFP.[Y] AS [Y_mm],\n(FP.[X] / 25.4) AS [X_in],\n(FP.[Y] / 25.4) AS [Y_in],\n\n--*****New Custom Field for CabinetProfile*****\nISNULL(CabinetProfile.[CabinetProfile], 'Unclassified') AS [CabinetProfile],\n\n--*****New Field for Neighborhood*****\nCASE \n\tWHEN BGM.[OwnershipPercentage]=100 AND BG.[ParentBusinessGroupID]=(SELECT [BusinessGroupID] FROM [nlyte].[dbo].[BusinessGroup] WHERE [BusinessGroupName]='Neighborhoods')\n\tTHEN BG.[BusinessGroupName]\n\tELSE 'Unclassified'\nEND AS [Neighborhood],\n\n--*****New Custom Field for IFDNumber*****\nIFDNumber.[IFDNumber]\n\nFROM [nlyte].[dbo].[Asset] AS A\nJOIN [nlyte].[dbo].[RecordStatus] AS RS ON RS.[RecordStatusID]=A.[RecordStatus]\nJOIN [nlyte].[dbo].[OperationalStatus] AS OS ON OS.[OperationalStatusID]=A.[AssetOperationalStatusID]\nJOIN [nlyte].[dbo].[Cabinet] AS CAB ON A.[AssetID]=CAB.[AssetID]\nJOIN [nlyte].[dbo].[CabinetUsage] AS CABTYPE ON CAB.[CabinetUsageID]=CABTYPE.[CabinetUsageID]\nJOIN [nlyte].[dbo].[Material] AS HW ON A.[MaterialID]=HW.[MaterialID]\nJOIN [nlyte].[dbo].[CabinetMaterial] AS CABHW ON A.[MaterialID]=CABHW.[MaterialID]\nJOIN [nlyte].[dbo].[LocationGroup] AS LG ON A.[LocationGroupID]=LG.[LocationGroupID]\nJOIN [nlyte].[dbo].[vwLocationGroupAncestralInfo] AS LGA ON LG.[LocationGroupID]=LGA.[LocationGroupID]\nLEFT JOIN [nlyte].[dbo].[LocationPurpose] aS LP ON LP.[LocationPurposeId]=LG.[LocationPurposeId]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [DCMFlavor] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='DCMFlavor') AS DCMFlavor ON A.[AssetID]=DCMFlavor.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [ServiceCat] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='ServiceCat') AS ServiceCat ON A.[AssetID]=ServiceCat.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [VerifiedRA] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='VerifiedRA') AS VerifiedRA ON A.[AssetID]=VerifiedRA.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [PlanningNotes] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='PlanningNotes') AS PlanningNotes ON A.[AssetID]=PlanningNotes.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [Status] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='Status') AS RKStatus ON A.[AssetID]=RKStatus.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueCheckBox] AS [CWExclude] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='CWExclude') AS CWExclude ON A.[AssetID]=CWExclude.[AssetID]\nLEFT JOIN[nlyte].[dbo].[vwAsset] AS AV ON AV.[AssetID]=A.[AssetID]\nLEFT JOIN [nlyte].[FloorPlanner].[vwRoomItem] AS FP ON FP.[AssetID]=AV.[AssetID]\nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [CabinetProfile] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='CabinetProfile') AS CabinetProfile ON A.[AssetID]=CabinetProfile.[AssetID]\nLEFT JOIN [nlyte].[dbo].[BusinessGroupAssetMap] AS BGM ON BGM.[AssetID]=A.[AssetID]\nLEFT JOIN [nlyte].[dbo].[BusinessGroup] AS BG ON BG.[BusinessGroupID]=BGM.[BusinessGroupID] \nLEFT JOIN (SELECT [AssetID], [DataValueString] AS [IFDNumber] FROM [nlyte].[dbo].[vwAssetCustomField] WHERE [DataLabel]='IFDNumber') AS IFDNumber ON A.[AssetID]=IFDNumber.[AssetID]\nWHERE (A.[RecordStatus]=2 OR A.[AssetOperationalStatusID] IN (1,2,3)) /*[RecordStatus]='Active' OR [AssetOperationalStatusID] IN ('Pre-Procurement','Procurement','Operational')*/\nORDER BY [SiteGroup], [SiteName], [DataHall], [AssetName]\n/*\nnlecwtotal Last Updated: 2026-06-10\nEnterprise Capacity Workbook Report\nnlecwtotal CW_Report_Query_2026-06-10.sql\nDARE_Enterprise CW Analysis Rack Capacity Details Report_NLYTE_ENV.rdl\n\tCHANGE NOTES:\n\t\tAdded [IFDNumber]\n*/","conversionSt
