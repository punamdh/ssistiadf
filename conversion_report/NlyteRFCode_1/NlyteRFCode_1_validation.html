Gets the min and max values per row from [t_DeviceDataPoints15Min]*/\n  (\n    SELECT\n        t.[DeviceDataID],\n        t.[DataEnd],\n        mn.[MinValue],\n        mx.[MaxValue]\n    FROM [Fieldviewtrend].[dbo].[t_DeviceDataPoints15Min] AS t\n\n    CROSS APPLY\n    (\n        SELECT\n            MIN(TRY_CONVERT(decimal(18, 2), s.value)) AS [MinValue]\n        FROM STRING_SPLIT(t.[MinValue], '|') AS s\n        WHERE TRY_CONVERT(decimal(18, 2), s.value) IS NOT NULL\n    ) AS mn\n\n    CROSS APPLY\n    (\n        SELECT\n            MAX(TRY_CONVERT(decimal(18, 2), s.value)) AS [MaxValue]\n        FROM STRING_SPLIT(t.[MaxValue], '|') AS s\n        WHERE TRY_CONVERT(decimal(18, 2), s.value) IS NOT NULL\n    ) AS mx\n    WHERE t.[DataEnd] >= DATEADD(DAY, -7, GETDATE())\n),\nRT15RankedValues AS\n/* ranks the min and max values per data point from [t_DeviceDataPoints15Min]*/\n(\n    SELECT\n        [DeviceDataID],\n        [DataEnd],\n        [MinValue],\n        [MaxValue],\n\n        ROW_NUMBER() OVER\n        (\n            PARTITION BY [DeviceDataID]\n            ORDER BY [MinValue] ASC, [DataEnd] ASC\n        ) AS [MinRank],\n\n        ROW_NUMBER() OVER\n        (\n            PARTITION BY [DeviceDataID]\n            ORDER BY [MinValue] DESC, [DataEnd] ASC\n        ) AS [MaxRank]\n    FROM RT15RowValues\n),\nRT15DeviceSummary AS\n/* grabs the smallest min and largest max values per data point from [t_DeviceDataPoints15Min]*/\n(\n    SELECT\n        [DeviceDataID],\n\n        MAX(CASE WHEN [MinRank] = 1\n                 THEN [MinValue] END) AS [NEOMinValue],\n\n        MAX(CASE WHEN [MinRank] = 1\n                 THEN [DataEnd] END) AS [NEOMinDate],\n\n        MAX(CASE WHEN [MaxRank] = 1\n                 THEN [MaxValue] END) AS [NEOMaxValue],\n\n        MAX(CASE WHEN [MaxRank] = 1\n                 THEN [DataEnd] END) AS [NEOMaxDate]\n    FROM RT15RankedValues\n    GROUP BY [DeviceDataID]\n),\nCF AS\n(\n    SELECT\n        [AssetID],\n        MAX(CASE\n              WHEN [DataLabel]='PDU_Zone'\n              THEN [DataValueString]\n            END) AS [PDU_Zone]\n    FROM [nlyte].[dbo].[vwAssetCustomField]\n    WHERE [DataLabel] IN\n    (\n        'PDU_Zone'\n    )\n    GROUP BY [AssetID]\n)\n\nSELECT \nCASE \n\tWHEN LG.[LocationGroupType]=8\n\tTHEN LG.[Tag] \n\tELSE (SELECT [Tag] FROM [nlyte].[dbo].[LocationGroup] WHERE [LocationGroupID]=LG.[ParentLocationGroupID])\nEND AS [SiteName],\nLGA.[Room] AS [DataHall],\nA.[AssetNumber],\nA.[AssetName],\nPDD.[PointValue] AS [RealtimePower_KW], /*Unit value is KW*/\nCAST((RT15.[NEOMinValue] + RT15.[NEOMaxValue]) / 2.0 AS decimal(18, 2)) AS [RealtimePowerAverage_KW], /*Unit value is KW*/\nRT15.[NEOMaxValue] AS [RealtimePowerMax_KW], /*Unit value is KW*/\nRT15.[NEOMinValue] AS [RealtimePowerMin_KW], /*Unit value is KW*/\nPDD.[PollDateTime] AS [RealtimeLastUpdated],\nMT.[Detail] AS [DeviceType],\nCF.[PDU_Zone]\n\nFROM [Fieldview].[dbo].[t_PollingDeviceConfigData] AS PDC\nJOIN [Fieldview].[dbo].[t_PollingDeviceData] AS PDD ON PDD.[DeviceDataId]=PDC.[ID]\nJOIN [Fieldview].[dbo].[t_PollingDeviceFunctions] AS PDF on PDF.[ID]=PDC.[FunctionID]\nJOIN [Fieldview].[dbo].[t_Device] AS D ON D.[ID]=PDC.[DeviceID]\nJOIN [Fieldview].[dbo].[t_PollingDeviceProfile] AS PDP ON PDP.[ID]=D.[ProfileID]\nJOIN [Fieldview].[Asset_Sync].[Device] AS FASD ON FASD.[DeviceID]=PDC.[DeviceID]\nJOIN [nlyte].[dbo].[Asset] AS A ON A.[AssetID]=FASD.[AssetID]\nJOIN [nlyte].[dbo].[LocationGroup] AS LG ON A.[LocationGroupID]=LG.[LocationGroupID]\nJOIN [nlyte].[dbo].[vwLocationGroupAncestralInfo] AS LGA ON LG.[LocationGroupID]=LGA.[LocationGroupID]\nJOIN [nlyte].[dbo].[Material] AS HW ON HW.[MaterialID]=A.[MaterialID]\nLEFT JOIN [nlyte].[dbo].[MaterialType] AS MT ON MT.[MaterialTypeID]=HW.[MaterialTypeID]\nLEFT JOIN [nlyte].[Integration].[vwAssetRealtimeData] AS RT ON RT.[AssetID]=A.[AssetID]\nLEFT JOIN CF ON CF.[AssetID]=A.[AssetID]\nLEFT JOIN RT15DeviceSummary AS RT15 ON RT15.[DeviceDataID]=PDC.[ID]\n\nWHERE \nPDP.[Profil  SELECT\n        [DeviceDataID],\n        [DataEnd],\n        [MinValue],\n        [MaxValue],\n\n        ROW_NUMBER() OVER\n        (\n            PARTITION BY [DeviceDataID]\n            ORDER BY [MinValue] ASC, [DataEnd] ASC\n        ) AS [MinRank],\n\n        ROW_NUMBER() OVER\n        (\n            PARTITION BY [DeviceDataID]\n            ORDER BY [MinValue] DESC, [DataEnd] ASC\n        ) AS [MaxRank]\n    FROM RT15RowValues\n),\nRT15DeviceSummary AS\n/* grabs the smallest min and largest max values per data point from [t_DeviceDataPoints15Min]*/\n(\n    SELECT\n        [DeviceDataID],\n\n        MAX(CASE WHEN [MinRank] = 1\n                 THEN [MinValue] END) AS [NEOMinValue],\n\n        MAX(CASE WHEN [MinRank] = 1\n                 THEN [DataEnd] END) AS [NEOMinDate],\n\n        MAX(CASE WHEN [MaxRank] = 1\n                 THEN [MaxValue] END) AS [NEOMaxValue],\n\n        MAX(CASE WHEN [MaxRank] = 1\n                 THEN [DataEnd] END) AS [NEOMaxDate]\n    FROM RT15RankedValues\n    GROUP BY [DeviceDataID]\n),\nCF AS\n(\n    SELECT\n        [AssetID],\n        MAX(CASE\n              WHEN [DataLabel]='PDU_Zone'\n              THEN [DataValueString]\n            END) AS [PDU_Zone]\n    FROM [nlyte].[dbo].[vwAssetCustomField]\n    WHERE [DataLabel] IN\n    (\n        'PDU_Zone'\n    )\n    GROUP BY [AssetID]\n)\n\nSELECT \nCASE \n\tWHEN LG.[LocationGroupType]=8\n\tTHEN LG.[Tag] \n\tELSE (SELECT [Tag] FROM [nlyte].[dbo].[LocationGroup] WHERE [LocationGroupID]=LG.[ParentLocationGroupID])\nEND AS [SiteName],\nLGA.[Room] AS [DataHall],\nA.[AssetNumber],\nA.[AssetName],\nPDD.[PointValue] AS [RealtimePower_KW], /*Unit value is KW*/\nCAST((RT15.[NEOMinValue] + RT15.[NEOMaxValue]) / 2.0 AS decimal(18, 2)) AS [RealtimePowerAverage_KW], /*Unit value is KW*/\nRT15.[NEOMaxValue] AS [RealtimePowerMax_KW], /*Unit value is KW*/\nRT15.[NEOMinValue] AS [RealtimePowerMin_KW], /*Unit value is KW*/\nPDD.[PollDateTime] AS [RealtimeLastUpdated],\nMT.[Detail] AS [DeviceType],\nC RowValues\n),\nRT15DeviceSummary AS\n/* grabs the smallest min and largest max values per data point from [t_DeviceDataPoints15Min]*/\n(\n    SELECT\n        [DeviceDataID],\n\n        MAX(CASE WHEN [MinRank] = 1\n                 THEN [MinValue] END) AS [NEOMinValue],\n\n        MAX(CASE WHEN [MinRank] = 1\n                 THEN [DataEnd] END) AS [NEOMinDate],\n\n        MAX(CASE WHEN [MaxRank] = 1\n                 THEN [MaxValue] END) AS [NEOMaxValue],\n\n        MAX(CASE WHEN [MaxRank] = 1\n                 THEN [DataEnd] END) AS [NEOMaxDate]\n    FROM RT15RankedValues\n    GROUP BY [DeviceDataID]\n),\nCF AS\n(\n    SELECT\n        [AssetID],\n        MAX(CASE\n              WHEN [DataLabel]='PDU_Zone'\n              THEN [DataValueString]\n            END) AS [PDU_Zone]\n    FROM [nlyte].[dbo].[vwAssetCustomField]\n    WHERE [DataLabel] IN\n    (\n        'PDU_Zone'\n    )\n    GROUP BY [AssetID]\n)\n\nSELECT \nCASE \n\tWHEN LG.[LocationGroupType]=8\n\tTHEN LG.[Tag] \n\tELSE (SELECT [Tag] FROM [nlyte].[dbo].[LocationGroup] WHERE [LocationGroupID]=LG.[ParentLocationGroupID])\nEND AS [SiteName],\nLGA.[Room] AS [DataHall],\nA.[AssetNumber],\nA.[AssetName],\nPDD.[PointValue] AS [RealtimePower_KW], /*Unit value is KW*/\nCAST((RT15.[NEOMinValue] + RT15.[NEOMaxValue]) / 2.0 AS decimal(18, 2)) AS [RealtimePowerAverage_KW], /*Unit value is KW*/\nRT15.[NEOMaxValue] AS [RealtimePowerMax_KW], /*Unit value is KW*/\nRT15.[NEOMinValue] AS [RealtimePowerMin_KW], /*Unit value is KW*/\nPDD.[PollDateTime] AS [RealtimeLastUpdated],\nMT.[Detail] AS [DeviceType],\nCF.[PDU_Zone]\n\nFROM [Fieldview].[dbo].[t_PollingDeviceConfigData] AS PDC\nJOIN [Fieldview].[dbo].[t_PollingDeviceData] AS PDD ON PDD.[DeviceDataId]=PDC.[ID]\nJOIN [Fieldview].[dbo].[t_PollingDeviceFunctions] AS PDF on PDF.[ID]=PDC.[FunctionID]\nJOIN [Fieldview].[dbo].[t_Device] AS D ON D.[ID]=PDC.[DeviceID]\nJOIN [Fieldview].[dbo].[t_PollingDeviceProfile] AS PDP ON PDP.[ID]=D.[ProfileID]\nJOIN [Fieldview].[Asset_Sync].[D
