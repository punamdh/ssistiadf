,"jobConversionStatus":null,"weight":null,"score":null,"unsupported":null}],"parentName":"Failure_Mail_0","message":null,"summary":null},"weight":null,"score":null,"unsupported":null},{"name":"Data_Flow_Task_32","generatedName":"DF_Data_Flow_Task_32","type":"ExecuteDataFlow","source":"ACTIVITY_GENERATION","conversionStatus":"SUCCESS","parent":"Mercury_Facs_MercuryToCalypso_Daily_ETL","parentType":"EXTERNAL","modificationStatus":"NONE","typeProperties":[],"messages":[{"message":"Inserted replication sub-pipeline 'REPL_Data_Flow_Task_32' before Data Flow 'DF_Data_Flow_Task_32' and added 1 Copy Data activity(ies) after it.","messageSource":"RULE","messageType":"WARN","unsupported":false,"unsupportedProperty":null,"propertyPartial":false},{"message":"As a workaround, the generic file linked service 'AzureBlobStorage1' is used as the staging linked service of data flow 'DF_Data_Flow_Task_32'. Review that it points at the storage account staging should use.","messageSource":"ACTIVITY_GENERATION","messageType":"WARN","unsupported":false,"unsupportedProperty":null,"propertyPartial":false},{"message":"Pipeline parameter 'Data_Flow_Task_32_StagingFolderPath' was created for the staging folder path of data flow 'DF_Data_Flow_Task_32'. It has no value: fill it in with the actual staging folder path (container/folder) before running the pipeline.","messageSource":"ACTIVITY_GENERATION","messageType":"WARN","unsupported":false,"unsupportedProperty":null,"propertyPartial":false}],"jobConversionStatus":{"name":"Data_Flow_Task_32","jobType":"DATAFLOW","conversionStatus":"PARTIAL","parameters":[],"components":[{"name":"Mercury_To_Calypso_Source","generatedName":null,"type":"OLE DB Source","source":"COMPONENT_ADOPTION","conversionStatus":"PARTIAL","parent":"Mercury_To_Calypso_Source","parentType":"INTERNAL","modificationStatus":"NONE","typeProperties":[{"key":"SQL_QUERY","name":"Sql_Query","value":"--Server: P1FIS01DB-SQL.WELLSFARGO.NET\\FACSPROD,11001\n--MERCURY TO CALYPSO RECON\n--DECLARE @EFFDATE DATE = '08/26/2020' \n\nWITH CTE_#TA AS \n(\nSELECT DISTINCT EFFDATE AS REPORTDATE,\n       TYPE,\n       upper(STRATEGY) as STRATEGY,\n       PORTNAME,\n       EXTACCOUNT,\n       EXTPRODUCT,\n       SYSTEMRECORD,\n       EXTERNAL_TRADE_ID,\n\t --  Imagine_Quantity = sum(CurrQty), --no match\n\t\t--Imagine_MV = sum(CurrMktValUsd), --no match\n\t\t--Imagine_DTD_PL = sum(DTDTotalNetPL),  --no match\n\t\t--imagine_YTD_PL = sum(YTDTotalNetPL) --no match\n       MERCURYTRADE_QUANTITY = SUM(CURRQTY), \n\t   MERCURYTRADE_MV = SUM(CURRMKTVALUSD), \n\t   MERCURYTRADE_DTD_PL = SUM(DTDTOTALNETPL), \n\t   MERCURYTRADE_YTD_PL = SUM(YTDTOTALNETPL) \n\t   --INTO #TA\nFROM FACSEDS.DBO.IMAGINE_TBLALL WITH (NOLOCK)\n--WHERE EFFDATE ='05/15/2024' -- @EFFDATE\n\nWHERE CAST(EFFDATE  AS DATE)= cast(DATEADD(DAY, CASE DATENAME(WEEKDAY, GETDATE())\nWHEN 'SUNDAY' THEN -2\nWHEN 'MONDAY' THEN -3\nELSE -1 END, DATEDIFF(DAY,0,GETDATE())) as date)\n\n\n\n  AND SYSTEMRECORD IN ('CALYPSO','ENDUR')\nGROUP BY EFFDATE,\n         TYPE,\n         STRATEGY,\n         PORTNAME,\n         EXTACCOUNT,\n         EXTPRODUCT,\n         SYSTEMRECORD,\n         EXTERNAL_TRADE_ID\n),\nCTE_#FACS AS\n(\nSELECT DISTINCT O.ENTITY,\n       O.SU7DESCRIPTION,\n       P.SOURCESYSTEMNAME,\n       POT.POSITIONTYPEDESCRIPTION1,\n       O.ENTITYDESCRIPTION,\n       O.DIVISIONDESCRIPTION,\n       O.DISTRICTDESCRIPTION,\n       O.SUBDISTRICT1DESCRIPTION,\n       O.INVENTORY,\n       ACTUALDATE,\n       PR.PRODUCTTYPE1,\n       PR.PRODUCTTYPE2,\n       I.FRONTOFFICEREFERENCEID,\n       TICKERSYMBOL,\n       SUM(COALESCE(P.QUANTITYCURRENTAMT, 0)) AS QUANTITY,\n       SUM(COALESCE(P.NPVCURRENTAMT, 0)) AS NPV,\n       SUM(COALESCE (P.UNREALIZEDGAINLOSSAMT,0) + COALESCE (P.REALIZEDGAINLOSSAMT,0)) AS DTD_PL,\n       SUM(COALESCE (P.UNREALIZEDGAINLOSSYTDAMT,0) + COALESCE (P.REALIZEDGAINLOSSYTDAMT,0)) AS YTD_PL \n\t\t\t\t\t\t\t\t\t--INTO #FACS\nFROM FACSOLAPDW.DBO.POSITIONS P WITH (NOLOCK)\nINNER JOIN FACSOLAPDW.DBO.ORGANIZATION O WITH (NOLOCK) ON O.ORGANIZATIONID = P.ORGANIZATIONID\nINNER JOIN FACSOLAPDW.DBO.PRODUCT PR WITH (NOLOCK) ON PR.PRODUCTID = P.PRODUCTID\nINNER JOIN FACSOLAPDW.DBO.INSTRUMENT I WITH (NOLOCK) ON I.INSTRUMENTID = P.INSTRUMENTID\nINNER JOIN FACSOLAPDW.DBO.CUSTOMERHISTORY C WITH (NOLOCK) ON C.CUSTOMERHISTORYID = P.CUSTOMERHISTORYID\nINNER JOIN FACSOLAPDW.DBO.POSITIONTYPE POT WITH (NOLOCK) ON POT.POSITIONTYPEID = P.POSITIONTYPEID\nINNER JOIN FACSEDS.dbo.CalypsoFOTrade cf ON p.ActualDate = cf.EffDate AND i.FrontOfficeReferenceId = CONVERT(VARCHAR(MAX),cf.trade_id)--Missing\n\n--WHERE P.ACTUALDATE ='05/15/2024' --@EFFDATE\n\nWHERE CAST(EFFDATE  AS DATE)= cast(DATEADD(DAY, CASE DATENAME\n(WEEKDAY, GETDATE())\nWHEN 'SUNDAY' THEN -2\nWHEN 'MONDAY' THEN -3\nELSE -1 END, DATEDIFF(DAY,0,GETDATE())) as date)\n\n\n\n  AND P.SOURCESYSTEMNAME = 'CALYPSO'\n  AND O.OU IN ('SECLENDING' ,\n               'EQRESEARCH' ,\n               'EQDERIV' ,\n               'EQCASH' ,\n               'EQADMIN',\n               'PRIMEBROK',\n               'EQDERIVOTH',\n               'VISAB',\n               'SYNEQTRDG')\n  AND POT.POSITIONTYPEDESCRIPTION1 = 'POSITION'\n  AND P.FRONTOFFICESYSTEMNAME <> 'MERCURYTRADE' \n  AND cf.trade_status = 'VERIFIED'\nGROUP BY O.ENTITY,\n         O.SU7DESCRIPTION,\n         P.SOURCESYSTEMNAME,\n         POT.POSITIONTYPEDESCRIPTION1,\n         O.ENTITYDESCRIPTION,\n         O.DIVISIONDESCRIPTION,\n         O.DISTRICTDESCRIPTION,\n         O.SUBDISTRICT1DESCRIPTION,\n         O.INVENTORY,\n         ACTUALDATE,\n         PR.PRODUCTTYPE1,\n         PR.PRODUCTTYPE2,\n         I.FRONTOFFICEREFERENCEID,\n         TICKERSYMBOL\n\n)\n\n\nSELECT REPORTDATE,\n       TYPE,\n       CASE WHEN STRATEGY = 'EQUITY OPTIONS' THEN 'CORP DERIVATIVES' ELSE STRATEGY END AS STRATEGY,\n       PORTNAME,\n       EXTACCOUNT,\n       EXTPRODUCT,\n       SYSTEMRECORD,\n       CASE WHEN FRONTOFFICEREFERENCEID IS NULL THEN 'IMAGINEONLY'\n            WHEN TA.EXTERNAL_TRADE_ID IS NULL THEN 'CALYPSOONLY' ELSE 'MATCH' END AS 'RECONSTATUS',\n       EXTERNAL_TRADE_ID AS 'CALYPSOID',\n\t\tCOALESCE (TA.MERCURYTRADE_QUANTITY, 0) AS 'MERCURYTRADEPOSITION',\n\t\tCOALESCE (FACS.QUANTITY, 0) AS 'CALYPSOPOSITION',\n\t\tCOALESCE (TA.MERCURYTRADE_QUANTITY, 0) - COALESCE (FACS.QUANTITY, 0) AS 'POSITION_DIFF',\n\t\tABS(COALESCE (TA.MERCURYTRADE_QUANTITY, 0)) AS 'ABSMERCURYTRADEPOSITION',\n\t\tABS(COALESCE (FACS.QUANTITY, 0)) AS 'ABSCALYPSOPOSITION',\n\t\tABS(COALESCE (TA.MERCURYTRADE_QUANTITY,0)) - ABS(COALESCE (FACS.QUANTITY,0)) AS 'ABSPOSITION_DIFF',\n\t\tCOALESCE (TA.MERCURYTRADE_MV,0) AS 'MERCURYTRADEMV',\n\t\tCOALESCE (FACS.NPV,0) AS 'CALYPSOMV',\n\t\tCOALESCE (TA.MERCURYTRADE_MV,0) - COALESCE (FACS.NPV,0) AS 'MV_DIFF',\n\t\tCOALESCE(MERCURYTRADE_DTD_PL,0) AS 'MERCURYTRADEDTD',\n\t\tCOALESCE(FACS.DTD_PL,0) AS 'CALYPSODTD',\n\t\tCOALESCE(MERCURYTRADE_DTD_PL,0) - COALESCE(FACS.DTD_PL,0) AS 'DTD_DIFF',\n\t\tCOALESCE(MERCURYTRADE_YTD_PL,0) AS 'MERCURYTRADEYTD',\n\t\tCOALESCE(FACS.YTD_PL,0) AS 'CALYPSOYTD',\n\t\tCOALESCE(MERCURYTRADE_YTD_PL,0) - COALESCE(FACS.YTD_PL,0) AS 'YTD_DIFF'\n\t  --  GETDATE() AS LOAD_DATE\nFROM CTE_#TA TA\nLEFT JOIN\n  (SELECT ENTITY,\n          SU7DESCRIPTION,\n          SOURCESYSTEMNAME,\n          POSITIONTYPEDESCRIPTION1,\n          ENTITYDESCRIPTION,\n          DIVISIONDESCRIPTION,\n          DISTRICTDESCRIPTION,\n          ACTUALDATE,\n          PRODUCTTYPE1,\n          PRODUCTTYPE2,\n          FRONTOFFICEREFERENCEID,\n          TICKERSYMBOL,\n          QUANTITY = SUM(QUANTITY),\n          NPV = SUM(NPV),\n          DTD_PL = SUM(DTD_PL),\n          YTD_PL = SUM(YTD_PL)\n   FROM CTE_#FACS\n   GROUP BY ENTITY,\n            SU7DESCRIPTION,\n            SOURCESYSTEMNAME,\n            POSITIONTYPEDESCRIPTION1,\n            ENTITYDESCRIPTION,\n            DIVISIONDESCRIPTION,\n            DISTRICTDESCRIPTION,\n            ACTUALDATE,\n            PRODUCTTYPE1,\n            PRODUCTTYPE2,\n            FRONTOFFICEREFERENCEID,\n            TICKERSYMBOL) FACS ON TA.REPORTDATE = FACS.ACTUALDATE\nAND TA.EXTERNAL_TRADE_ID = FACS.FRONTOFFICEREFERENCEID\nWHERE ABS(COALESCE(TA.MERCURYTRADE_QUANTITY, 0)) + ABS(COALESCE(FACS.QUANTITY, 0)) + ABS(COALESCE(TA.MERCURYTRADE_MV, 0)) + ABS(COALESCE(FACS.NPV, 0)) <> 0\n\nUNION \n\nSELECT DISTINCT FACS.ACTUALDATE,\n       FACS.PRODUCTTYPE1,\n       CASE\n           WHEN FACS.DISTRICTDESCRIPTION = 'CONVERTIBLE TRADING' THEN 'CB SALES'\n           WHEN FACS.DISTRICTDESCRIPTION = 'EQUITY LINKED PRODUCTS' THEN 'CORP DERIVATIVES'\n           WHEN FACS.DISTRICTDESCRIPTION = 'INDEX' THEN 'INDEX OPTIONS'\n           WHEN FACS.SUBDISTRICT1DESCRIPTION LIKE 'IS TRADING%' THEN 'IS TRADING'\n           WHEN FACS.SUBDISTRICT1DESCRIPTION = 'SEP WEST' THEN 'WEST EQ ST PROD'\n           WHEN FACS.SUBDISTRICT1DESCRIPTION = 'ETF SALES TRADING TOTAL' THEN 'SWAPS (ETF)'\n           ELSE FACS.DISTRICTDESCRIPTION\n       END AS STRATEGY,\n       NULL AS PORTFOLIO,\n       FACS.INVENTORY,\n       FACS.PRODUCTTYPE2,\n       FACS.SOURCESYSTEMNAME,\n       CASE\n           WHEN FRONTOFFICEREFERENCEID IS NULL THEN 'IMAGINEONLY'\n           WHEN TA.EXTERNAL_TRADE_ID IS NULL THEN 'CALYPSOONLY'\n           ELSE 'MATCH'\n       END AS 'RECONSTATUS',\n       FACS.FRONTOFFICEREFERENCEID AS 'CALYPSOID',\n\t\t\tCOALESCE (TA.MERCURYTRADE_QUANTITY,0) AS 'MERCURYTRADEPOSITION',\n\t\t\tCOALESCE (FACS.QUANTITY,0) AS 'CALYPSOPOSITION',\n\t\t\tCOALESCE (TA.MERCURYTRADE_QUANTITY,0) - COALESCE (FACS.QUANTITY,0) AS 'POSITION_DIFF',\n\t\t\tABS(COALESCE (TA.MERCURYTRADE_QUANTITY,0)) AS 'ABSMERCURYTRADEPOSITION',\n\t\t\tABS(COALESCE (FACS.QUANTITY,0)) AS 'ABSCALYPSOPOSITION',\n\t\t\tABS(COALESCE (TA.MERCURYTRADE_QUANTITY,0)) - ABS(COALESCE (FACS.QUANTITY,0)) AS 'ABSPOSITION_DIFF',\n\t\t\tCOALESCE (TA.MERCURYTRADE_MV,0) AS 'MERCURYTRADEMV',\n\t\t\tCOALESCE (FACS.NPV,0) AS 'CALYPSOMV',\n\t\t\tCOALESCE (TA.MERCURYTRADE_MV,0) - COALESCE (FACS.NPV,0) AS 'MV_DIFF',\n\t\t\tCOALESCE(MERCURYTRADE_DTD_PL,0) AS 'MERCURYTRADEDTD',\n\t\t\tCOALESCE(FACS.DTD_PL,0) AS 'CALYPSODTD',\n\t\t\tCOALESCE(MERCURYTRADE_DTD_PL,0) - COALESCE(FACS.DTD_PL,0) AS 'DTD_DIFF',\n\t\t\tCOALESCE(MERCURYTRADE_YTD_PL,0) AS 'MERCURYTRADEYTD',\n\t\t\tCOALESCE(FACS.YTD_PL,0) AS 'CALYPSOYTD',\n\t\t\tCOALESCE(MERCURYTRADE_YTD_PL,0) - COALESCE(FACS.YTD_PL,0) AS 'YTD_DIFF'\n\t\t\t--GETDATE() AS LOAD_DATE\nFROM CTE_#TA TA\nRIGHT JOIN\n  (SELECT DISTINCT ENTITY,\n          SU7DESCRIPTION,\n          SOURCESYSTEMNAME,\n          POSITIONTYPEDESCRIPTION1,\n          ENTITYDESCRIPTION,\n          DIVISIONDESCRIPTION,\n          DISTRICTDESCRIPTION,\n          SUBDISTRICT1DESCRIPTION,\n          INVENTORY,\n          ACTUALDATE,\n          PRODUCTTYPE1,\n          PRODUCTTYPE2,\n          FRONTOFFICEREFERENCEID,\n          TICKERSYMBOL,\n          QUANTITY = SUM(QUANTITY),\n          NPV = SUM(NPV),\n          DTD_PL = SUM(DTD_PL),\n          YTD_PL = SUM(YTD_PL)\n   FROM CTE_#FACS\n   GROUP BY ENTITY,\n            SU7DESCRIPTION,\n            SOURCESYSTEMNAME,\n            POSITIONTYPEDESCRIPTION1,\n            ENTITYDESCRIPTION,\n            DIVISIONDESCRIPTION,\n            DISTRICTDESCRIPTION,\n            SUBDISTRICT1DESCRIPTION,\n            INVENTORY,\n            ACTUALDATE,\n            PRODUCTTYPE1,\n            PRODUCTTYPE2,\n            FRONTOFFICEREFERENCEID,\n            TICKERSYMBOL) FACS ON TA.REPORTDATE = FACS.ACTUALDATE\nAND TA.EXTERNAL_TRADE_ID = FACS.FRONTOFFICEREFERENCEID\nWHERE ABS(COALESCE(TA.MERCURYTRADE_QUANTITY, 0)) + ABS(COALESCE(FACS.QUANTITY, 0)) + ABS(COALESCE(TA.MERCURYTRADE_MV, 0)) + ABS(COALESCE(FACS.NPV, 0)) <> 0\n  AND TA.REPORTDATE IS NULL","conversionStatus":"PARTIAL"},{"key":"PRE_SQL","name":"Pre_Sql","value":null,"conversionStatus":"PARTIAL"},{"key":"POST_SQL","name":"Post_Sql","value":null,"conversionStatus":"PARTIAL"},{"key":"TABLE_NAME","name":"Table_Name","value":null,"conversionStatus":"PARTIAL"},{"key":"DATABASE","name":"Database","value":"DBGENERIC","conversionStatus":"PARTIAL"},{
