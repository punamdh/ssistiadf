<body class="bg-surface font-sans text-on-surface text-[13px]">
  <header class="sticky top-0 z-50 bg-surface/95 backdrop-blur border-b border-surface-container shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-3 flex flex-col gap-2">
      <div class="flex items-center justify-between gap-4 flex-wrap">
        <div class="flex items-center gap-2 flex-wrap font-mono text-[12px] text-on-surface-variant">
          <img src="assets/images/FULKRUM-FULL-COLOR.png" alt="Company Logo" class="h-6" style="pointer-events:none;" />
          <span class="font-sans font-semibold text-[15px] text-on-surface">Conversion Report</span>
          <span class="text-outline-variant">/</span>
          <span>Source: <strong id="sourcetool" class="text-on-surface font-semibold"></strong></span>
          <span class="material-symbols-outlined text-[15px] text-outline">trending_flat</span>
          <span>Target: <strong id="targettool" class="text-on-surface font-semibold"></strong></span>
          <span class="text-outline-variant">/</span>
          <span id="jobname" class="text-on-surface font-semibold"></span>
        </div>
        <div class="flex items-center gap-2">
          <div class="relative">
            <span class="material-symbols-outlined absolute left-2 top-1/2 -translate-y-1/2 text-[16px] text-outline">search</span>
            <input id="searchTerm" type="text" placeholder="Search component by name"
              class="h-8 pl-8 pr-3 rounded border border-surface-container-high bg-surface-container-lowest text-[13px] focus:outline-none focus:ring-1 focus:ring-primary w-64" />
          </div>
          <button onclick="window.print()" class="h-8 px-3 rounded bg-surface-container-low hover:bg-surface-container text-on-surface-variant text-[12px] font-semibold flex items-center gap-1">
            <span class="material-symbols-outlined text-[15px]">print</span>
            <span>Export / Print</span>
          </button>
        </div>
      </div>
      <div id="statusBar" class="flex items-center gap-3 flex-wrap"></div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-5 flex flex-col gap-5">
    <div id="kpiCards" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4"></div>

    <div class="bg-surface-container-lowest rounded p-3 shadow-sm flex flex-col md:flex-row items-center justify-between gap-3">
      <div id="statusChips" class="flex items-center gap-1 flex-wrap"></div>
      <div class="flex items-center gap-2 flex-wrap">
        <select id="selectedType" class="h-8 px-2 rounded border border-surface-container-high bg-surface-container-lowest text-[13px] focus:outline-none focus:ring-1 focus:ring-primary"></select>
        <button onclick="resetFilters()" class="h-8 px-3 rounded bg-surface-container-low hover:bg-surface-container text-on-surface-variant text-[12px] font-semibold flex items-center gap-1">
          <span class="material-symbols-outlined text-[15px]">filter_alt_off</span>
          <span>Reset</span>
        </button>
      </div>
    </div>

    <div id="validationSection" class="flex-col gap-3" style="display:none">
      <div class="flex items-center gap-2 flex-wrap">
        <h2 class="text-[13px] font-semibold uppercase tracking-wide text-on-surface-variant">Azure Data Factory Validation</h2>
        <span id="validationSummary" class="font-mono text-[12px] text-on-surface-variant"></span>
      </div>
      <div id="validationResults" class="flex flex-col gap-3"></div>
    </div>

    <div class="flex flex-col gap-3">
      <h2 class="text-[13px] font-semibold uppercase tracking-wide text-on-surface-variant">Component List</h2>
      <div class="accordion flex flex-col gap-3"></div>
    </div>
  </main>

  <footer id="footerdate" class="max-w-7xl mx-auto px-6 py-4 text-[12px] text-on-surface-variant"></footer>
</body>
